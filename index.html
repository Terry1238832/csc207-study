<script id="course-data" type="application/json">{"version": 1, "chapters": [{"id": "start", "title": "从零读懂第一个 Java 程序", "subtitle": "先知道程序怎样开始、每个符号在做什么，再开始写代码。", "minutes": 35, "source": [{"file": "W01_101_102.pdf", "pages": "20–38"}], "objectives": ["分清源代码、编译器、字节码和 JVM", "逐词读懂传统 main 方法的声明", "知道 args 是谁传进来的，以及下标为什么从 0 开始", "区分编译错误、运行时错误和逻辑错误"], "sections": [{"title": "1 · 程序是什么，CSC207 又在学什么", "html": "<p>程序是一组足够明确、可以按顺序执行的指令。例如“读入两个整数，把它们相加，显示结果”已经是一个小程序的想法。电脑不会自动理解“算一下差不多的结果”；我们需要把输入、运算步骤和输出写清楚。Java 是表达这些指令的一种语言，和中文、英文一样有语法，只是它要求更精确。<\/p><p>CSC207 的重点逐渐从“写出能运行的几行代码”走向“把很多类、很多功能组织得清楚，方便测试和合作”。但设计之前必须看懂程序的基本行为。本课程先铺 Java 的基础，再接到类、继承、GUI 和软件设计。你不需要先会 Python；如果课件写“这和 Python 类似”，这里会直接解释 Java 的规则。<\/p><p>复习时每个例子都做三件事：先预测结果，再按行追踪，最后改变一个输入看看为什么变了。你能解释一行代码怎样改变状态，才算真正掌握它。<\/p>"}, {"title": "2 · 从 .java 到实际运行：四个角色", "html": "<p><strong>源代码<\/strong>是你能读的文本，例如 Hello.java。<strong>编译器 javac<\/strong>检查 Java 语法和类型，并把通过检查的源代码变成 .class 字节码。<strong>字节码<\/strong>面向 Java 虚拟机，而不是直接面向某一种电脑处理器。<strong>JVM<\/strong>负责执行字节码，并处理运行所需的环境。<\/p><pre><code>javac Hello.java\njava Hello<\/code><\/pre><p>第一行的对象是文件 Hello.java；第二行通常给的是类名 Hello，不带 .class。实际项目可能有 package、classpath 或构建工具，这里先用没有 package 的单文件例子。IntelliJ 的运行按钮会替你完成相关步骤，但按钮没有改变语言规则。<\/p><p>可以把它理解成“写食谱 → 先检查食谱格式 → 转成统一操作说明 → 厨房按说明执行”。编译成功只意味着通过了一批静态检查，不代表结果一定正确。比如把总价写成减法，Java 未必知道你原本想加法。<\/p>"}, {"title": "3 · 一份完整、最小的传统程序", "html": "<pre><code>public class Hello {\n    public static void main(String[] args) {\n        System.out.println(&quot;Hello, CSC207!&quot;);\n    }\n}<\/code><\/pre><p>从外到内读：<code>class Hello<\/code>声明名为 Hello 的类；大括号包住类的内容。类中的 <code>main<\/code> 是这里采用的传统程序入口；它自己的大括号包住入口运行时的操作。<code>System.out.println(...)<\/code>显示括号中的内容，并在最后换行。双引号包住的是字符串文字，显示时通常不会连双引号一起显示。<\/p><p><code>;<\/code>结束这里的语句；<code>{ }<\/code>划分代码块；<code>( )<\/code>用于参数列表或方法调用；<code>[ ]<\/code>稍后用于数组。缩进让人看清结构，而 Java 判断代码块依靠的是大括号。你可以先把外层模板当成稳定的框架，在 main 内按顺序放指令。<\/p><p>这个例子应放在 <code>Hello.java<\/code>，因为 public 顶层类的名字是 Hello，大小写也要一致。Java 中 <code>Hello<\/code> 和 <code>hello<\/code> 是不同的名字。<\/p>"}, {"title": "4 · 把 public static void main(String[] args) 拆开", "html": "<table><thead><tr><th>部分<\/th><th>在这段入口声明中的含义<\/th><\/tr><\/thead><tbody><tr><td>public<\/td><td>对外可访问；这是传统入口签名的一部分。<\/td><\/tr><tr><td>static<\/td><td>方法属于类；启动时不需要你先创建一个 Hello 对象。<\/td><\/tr><tr><td>void<\/td><td>这次方法调用不返回一个供调用者接收的结果值。<\/td><\/tr><tr><td>main<\/td><td>传统入口方法使用的名字。<\/td><\/tr><tr><td>String[]<\/td><td>参数的类型：装着字符串的数组。<\/td><\/tr><tr><td>args<\/td><td>这个参数变量的名字；可以改为 words 等合法名字。<\/td><\/tr><\/tbody><\/table><p>这里要分清“参数的类型”和“参数的名字”。<code>String[]<\/code>参与方法签名匹配，<code>args<\/code>只是方法内部引用这个参数时使用的名字。写成 <code>String[] words<\/code>，并在方法中使用 words，同样可以。课程采用这份经典入口写法；不要由它推断所有 Java 方法都必须有 args。<\/p><p>“main 没有用 args，为什么还要写？”因为这份入口约定规定启动器用一个字符串数组调用它。你可以接收后暂时不用，就像表格里有一栏这次恰好空着。<code>void<\/code>也不表示“不能输出”；打印到屏幕和返回一个值是两种不同的行为。<\/p>"}, {"title": "5 · 谁把内容放进 args？不是 main 自己猜出来的", "html": "<pre><code>public class Hello {\n    public static void main(String[] args) {\n        System.out.println(args.length);\n        if (args.length &gt; 0) {\n            System.out.println(args[0]);\n        }\n    }\n}\n// 终端：java Hello apple banana\n// 输出：\n// 2\n// apple<\/code><\/pre><p>启动器把类名后面的命令行参数交给 main；上面的两个参数成为 <code>args[0]<\/code> 和 <code>args[1]<\/code>。下标从 0 开始，所以长度为 2 时，合法下标是 0 和 1。<code>args.length<\/code>是元素个数，不是最后一个下标。用 <code>java Hello<\/code>启动时，这个例子中的数组长度是 0；不是说 args 必然是 null。<\/p><p>所有这些参数起初都是字符串。如果输入 <code>java Hello 12 30<\/code>，main 收到的是字符串 \"12\" 和 \"30\"，不是两个 int。要算数字，可以用 <code>Integer.parseInt(args[0])<\/code>转成整数；如果字符串不是合法整数，会发生运行时错误。IntelliJ 的 Program arguments 是同一种输入渠道。<code>Scanner(System.in)<\/code>读终端交互输入则是另一种机制，不要和 args 混在一起。<\/p>"}, {"title": "6 · 顺序、变量和状态：用表格代替脑补", "html": "<pre><code>int score = 3;\nscore = score + 2;\nSystem.out.println(score);<\/code><\/pre><p>第一行创建一个名叫 score 的 int 变量，并把它的当前值设为 3。第二行先算右侧：读取旧 score 的 3，加 2 得 5；再把 5 存回左侧 score。第三行读取当前的 5 并输出。赋值符号 <code>=<\/code>是“把右边的结果存到左边”，不是数学证明里的“永远相等”。<\/p><table><thead><tr><th>执行之后<\/th><th>score<\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>第 1 行<\/td><td>3<\/td><td>无<\/td><\/tr><tr><td>第 2 行<\/td><td>5<\/td><td>无<\/td><\/tr><tr><td>第 3 行<\/td><td>5<\/td><td>5<\/td><\/tr><\/tbody><\/table><p>这就是追踪表：每次只执行当前一行，再更新变量。程序越长，越不要凭整体印象猜。遇到循环就重复填表；遇到方法调用就记录参数；遇到对象就给对象编号。后面的互动演示就是把这项动作可视化。<\/p>"}, {"title": "7 · 三种错误与最有效的自查顺序", "html": "<p><strong>编译错误<\/strong>：程序不能通过编译，例如漏分号、名字不存在、<code>int x = \"hello\";<\/code>把字符串赋给 int。先读错误信息指向的第一处；后面的很多错误可能只是它带来的连锁反应。<\/p><p><strong>运行时错误<\/strong>：通过编译，但执行到某行出问题，例如长度为 0 的 args 却访问 args[0]，或对 null 调用方法。先看异常名称、出错行和这行实际拿到的数据。<strong>逻辑错误<\/strong>：程序正常结束，但答案不合要求，例如要输出 1 到 3，却只输出到 2。<\/p><p>每次卡住先问：代码有编译成功吗？如果成功，执行到了哪一行？那一刻每个变量的值是什么？预期行为和实际行为从哪一步分开？不要一边不看报错，一边随机改几个符号。最后把例子缩小到最少的几行，这通常比重读整份程序更快。<\/p>"}], "quiz": [{"id": "start-1", "kind": "mcq", "prompt": "在课程采用的传统入口声明里，args 没有被使用。哪种解释正确？", "options": ["既然没用，就必须把 String[] args 全删掉", "传统入口需要这个字符串数组参数，但方法体可以不使用它", "args 是 Java 关键字，名称绝对不能改", "args 会自动保存所有局部变量"], "answer": 1, "explanation": "传统 main 入口签名接收 String[]；参数名可以改。是否在方法体里使用参数，不影响这份声明本身是否合法。", "hint": "区分入口约定需要的参数类型与方法体当前是否使用它。", "tags": ["main", "args"]}, {"id": "start-2", "kind": "text", "prompt": "运行 java Hello red blue，下面输出什么？", "answer": ["2"], "explanation": "类名 Hello 之后有 red 和 blue 两个命令行参数，数组长度是 2；合法下标是 0 和 1。", "hint": "args.length 数的是元素个数，不是最后一个下标。", "tags": ["args", "数组"], "code": "System.out.println(args.length);"}, {"id": "start-3", "kind": "mcq", "prompt": "哪一条通常用于把 Hello.java 编译为字节码？", "options": ["java Hello.class", "javac Hello.java", "javac Hello.class", "println Hello.java"], "answer": 1, "explanation": "javac 编译 .java 源文件；java Hello 启动 Hello 类。课程例子不涉及 package 或额外 classpath。", "hint": "编译和启动执行是两个步骤。", "tags": ["编译", "JVM"]}, {"id": "start-4", "kind": "text", "prompt": "依次执行下面三行，最终打印什么？", "answer": ["7"], "explanation": "先令 n 为 4，再计算旧 n 的 4 加 3 并存回 n，最后输出 7。赋值不是数学上的恒等关系。", "hint": "右侧先求值，结果再写入左侧。", "tags": ["赋值", "追踪"], "code": "int n = 4;\nn = n + 3;\nSystem.out.println(n);"}, {"id": "start-5", "kind": "mcq", "prompt": "程序可编译，运行时 args 长度为 0，却执行 args[0]。这首先属于哪类问题？", "options": ["编译错误", "运行时错误", "Java 自动把 args[0] 变成空字符串", "只有逻辑错误，绝不抛异常"], "answer": 1, "explanation": "访问空数组的第一个元素会在执行时抛出 ArrayIndexOutOfBoundsException。应先检查长度。", "hint": "类型上是字符串数组，不代表每个可能的下标都存在。", "tags": ["错误分类", "边界"]}]}, {"id": "expressions", "title": "变量、类型与表达式：每一步都算清楚", "subtitle": "掌握整数除法、类型转换、字符串、比较和自增，消除读输出题的常见陷阱。", "minutes": 45, "source": [{"file": "W01_101_102.pdf", "pages": "30–49"}, {"file": "W02_101_102.pdf", "pages": "3–5"}], "objectives": ["用类型和当前值一起描述一个变量", "算清整数除法、拼接、自增和短路的执行过程", "区分引用比较和内容比较", "识别隐式转换、强制转换与浮点精度的边界"], "sections": [{"title": "1 · 变量不是随便装东西的盒子：类型先决定规则", "html": "<pre><code>int count = 3;\ndouble price = 3.5;\nboolean ready = false;\nchar grade = &#x27;A&#x27;;\nString name = &quot;Amy&quot;;<\/code><\/pre><p>声明的一般结构是 <code>类型 名字 = 初始值;<\/code>。int 存整数；double 常用于带小数的近似数；boolean 只有 true 或 false；char 是一个 UTF-16 代码单元，基础例子如字母 A；String 表示字符串对象。单引号写 char，双引号写 String，<code>'A'<\/code>和 <code>\"A\"<\/code>类型不同。<\/p><p>Java 是静态类型语言：编译器根据声明检查允许的操作。声明 <code>int count<\/code>之后，不能把 count 改装成字符串。变量的值可以改变，声明的类型不会因为赋值变成另一种。把名字、类型、当前值写成三列，是后面理解多态的准备工作。<\/p><p>八种基本类型是 byte、short、int、long、float、double、char、boolean。String、数组和你定义的类都是引用类型。不要因为 String 常用就把它当成第九种基本类型。基本类型和引用类型的赋值差异将在“引用与值传递”章详细演示。<\/p>"}, {"title": "2 · 整数、浮点数与转换：先看运算发生时的类型", "html": "<pre><code>System.out.println(5 / 2);       // 2\nSystem.out.println(5 / 2.0);     // 2.5\ndouble a = 5 / 2;               // 2.0\ndouble b = (double) 5 / 2;      // 2.5\nint c = (int) 3.9;              // 3<\/code><\/pre><p><code>5 / 2<\/code>的两个操作数都是整数，先做整数除法，结果是 2；之后存进 double，只会得到 2.0，丢掉的小数不会被补回来。<code>(double) 5<\/code>在除法之前把 5 转成浮点数，因此后面的除法是浮点除法。强制转换的位置比“最后变量是不是 double”更重要。<\/p><p>整数除法向 0 截断，所以 <code>-5 / 2<\/code>是 -2。<code>%<\/code>是余数，<code>5 % 2<\/code>是 1；常用来判断偶数 <code>n % 2 == 0<\/code>。从 double 转 int 会去掉小数部分，不是四舍五入。除数为 0 时，整数除法会抛异常；浮点运算则有 Infinity、NaN 等规则，不能把两者混为一谈。<\/p><p>普通的无后缀整数常量 <code>3<\/code>默认是 int（不是 short int），<code>3.0<\/code>默认是 double；需要 long 字面量可写 3L，需要 float 可写 3.0f。课件里的规则图帮助理解常见数值转换，但“拓宽转换”不保证永不损失精度，例如较大的 int 转 float 可能失去精确整数值。<\/p>"}, {"title": "3 · 自动转换不等于任意赋值都能通过", "html": "<p><code>double d = 3;<\/code>合法：int 值可以按规则转换为 double。<code>int i = 3.0;<\/code>一般不合法：double 不能在这条赋值中自动收窄成 int，哪怕数学上 3.0 没有小数部分。可以明确写 <code>int i = (int) 3.0;<\/code>表达你接受转换的后果。<\/p><pre><code>byte small = 100;\n// byte tooLarge = 200;  // 编译错误：200 超出 byte 范围\nint x = 259;\nbyte y = (byte) x;     // 3：截掉高位，绝不是安全“缩小”<\/code><\/pre><p>byte 的范围是 -128 到 127。强制转换是你要求编译器按转换规则处理，不是要求系统保证原值不变。另一个常见细节是 byte/short/char 参与普通整数算术时通常先提升为 int，所以 <code>byte a=1; byte b=2; int c=a+b;<\/code>自然，而直接把 a+b 赋给 byte 可能需要进一步处理。<\/p><p>局部变量必须在读取前被明确赋值。<code>int n; System.out.println(n);<\/code>不能编译；不要把对象字段有默认值的规则套到所有局部变量上。遇到类型题，依次检查“声明类型 → 表达式类型 → 这条赋值允许的转换”，比凭数值看起来像不像更可靠。<\/p>"}, {"title": "4 · + 到底是加法还是拼接？从左往右看", "html": "<pre><code>System.out.println(1 + 2 + &quot; apples&quot;);  // 3 apples\nSystem.out.println(&quot;apples &quot; + 1 + 2);  // apples 12\nSystem.out.println(&quot;apples &quot; + (1 + 2)); // apples 3<\/code><\/pre><p><code>+<\/code>两边是数值时，做数值加法；当表达式中的 + 走到字符串连接时，会形成字符串。连续的 + 按左结合计算。第一行先算 1+2 得 3，再接 \" apples\"。第二行先得到 \"apples 1\"，再接 2，所以结果末尾是 12，绝不是 3。<\/p><p>小括号先算，所以第三行的 1+2 在拼接前就得到 3。打印混合文字和计算时，推荐主动加括号：<code>\"total = \" + (a + b)<\/code>。这是为了让读的人和计算机都清楚你想把什么当作一个结果。<\/p><p><code>print<\/code>通常不在最后换行，<code>println<\/code>会换行。字符串里的 <code>\n<\/code>表示换行字符；<code>\"<\/code>表示字符串内部的双引号。做输出题时要注意空格和换行，但先保证核心值和执行顺序算对。<\/p>"}, {"title": "5 · == 与 equals：问的是两个不同的问题", "html": "<pre><code>String a = new String(&quot;cat&quot;);\nString b = new String(&quot;cat&quot;);\nSystem.out.println(a == b);      // false\nSystem.out.println(a.equals(b)); // true<\/code><\/pre><p>对 int 等基本类型，<code>==<\/code>比较值。对引用类型，<code>==<\/code>比较两个引用是否指向同一个对象，或是否都为 null。上面用了两次 new，创建了两个不同的 String 对象；它们文字相同，身份不同。String 的 <code>equals<\/code>按字符内容比较，所以为 true。<\/p><p>字符串常量可能被共享：<code>String a=\"cat\"; String b=\"cat\";<\/code>在这种情形下 a==b 可为 true。这种现象不能用来证明比较字符串内容时该用 ==。你的程序应该表达真正想问的问题：是否同一个对象，用 ==；是否同样的字符串内容，用 equals。<\/p><p>如果 a 为 null，<code>a.equals(\"cat\")<\/code>会抛 NullPointerException；<code>\"cat\".equals(a)<\/code>则为 false。以后自定义类若未重写 equals，继承来的 Object.equals 默认表现仍是身份比较，并不会自动逐个比较所有字段。<\/p>"}, {"title": "6 · 浮点比较：屏幕上像一样，内部也未必一样", "html": "<pre><code>double x = 0.1 + 0.2;\ndouble y = 0.3;\nSystem.out.println(x == y);               // false\nSystem.out.println(Math.abs(x - y) &lt; 1e-9); // true<\/code><\/pre><p>许多十进制小数不能用有限长度的二进制浮点数精确保存。运算还会舍入，所以“数学上相等”不自动等于“存储的浮点值完全相等”。上面的容差比较问的是差值是否足够小，而不是比特层面是否完全相同。<\/p><p>epsilon 应根据问题的尺度、单位和误差需求选，1e-9 只是本例教学用值，不是任何题目的万能答案。数字很大时可能需要相对误差；极端值又有更多细节。CSC207 基础复习中，先掌握为何不应随意用 == 判定经过计算的 double 相等，以及 <code>Math.abs(a-b)&lt;epsilon<\/code>的含义。<\/p><p>这也解释了为什么不能把 double 的问题归咎于“Java 算错了”：程序在它所承诺的浮点模型里计算，只是该模型并非任意精度实数。需要精确十进制金额的真实系统会采用适合该要求的表示方式，这里不扩展实现。<\/p>"}, {"title": "7 · ++i 和 i++：当前表达式拿到哪一个值？", "html": "<pre><code>int i = 8;\nSystem.out.println(i++);       // 输出 8，之后 i=9\nSystem.out.println(++i);       // 先 i=10，输出 10\nSystem.out.println(i++ * ++i); // 10 * 12 = 120，最后 i=12<\/code><\/pre><p>后缀 <code>i++<\/code>把旧值作为该表达式的值，同时令 i 增加 1；前缀 <code>++i<\/code>先把 i 增加 1，再把新值作为表达式的值。单独写成一条语句时，它们都令变量增加 1，区别出现在这个表达式的值还被拿来使用的时候。<\/p><p>第三行从 i=10 开始，先求左操作数 i++：乘法左边拿到 10，变量已变 11；再求右操作数 ++i：变量先变 12，右边拿到 12；最后相乘得 120。Java 对这些操作数有确定的求值顺序，但这种写法难读，实际代码应拆开。<\/p><p>考试可以考你追踪这种表达式；良好设计却鼓励减少副作用。解题时写两栏：“表达式交出的值”和“变量执行后的值”。这样就不会把“打印出什么”和“变量最后是多少”混成一件事。<\/p>"}, {"title": "8 · boolean、短路与保护条件", "html": "<pre><code>int number = 0;\nint sum = 12;\nboolean ok = (number != 0) &amp;&amp; (sum / number &gt; 5);\nSystem.out.println(ok); // false，不会执行右边的除法<\/code><\/pre><p><code>&amp;&amp;<\/code>要求两边都为 true；<code>||<\/code>只要一边为 true；<code>!<\/code>取反。Java 的 if/while 条件必须产生 boolean，不能直接把整数 1 当成 true。比较相等用 ==，赋值用 =；它们形状相近，含义不同。<\/p><p>短路的意思是结果已确定，就不再求另一边：&amp;&amp; 左边为 false 时跳过右边；|| 左边为 true 时跳过右边。上例先确定 number 为 0，左边 false，于是安全跳过除法。如果把两边交换，除法先发生，保护就失效了。<\/p><p>常见保护写法还有 <code>text != null &amp;&amp; text.length() &gt; 0<\/code>，以及 <code>i &gt;= 0 &amp;&amp; i &lt; a.length<\/code>。别把单个 &amp;、| 和用于逻辑短路的 &amp;&amp;、|| 随意互换。表达式复杂时主动加括号，先说明你期望的组合，再谈优先级。<\/p>"}], "quiz": [{"id": "expressions-1", "kind": "text", "prompt": "下面最后输出什么？", "answer": ["2.0"], "explanation": "5 和 2 都是 int，先做整数除法得到 2，再转换成 double 存入 result，打印为 2.0。", "hint": "看除法发生时两边的类型。", "tags": ["整数除法", "转换"], "code": "double result = 5 / 2;\nSystem.out.println(result);"}, {"id": "expressions-2", "kind": "text", "prompt": "请写出输出的一整行。", "answer": ["sum=23"], "explanation": "先由 \"sum=\" + 2 形成 \"sum=2\"，接着连接 3，得到 \"sum=23\"。若要 sum=5，应写 \"sum=\" + (2 + 3)。", "hint": "连续的 + 按左结合；加入字符串后问自己下一步还在做加法吗。", "tags": ["字符串", "运算顺序"], "code": "System.out.println(\"sum=\" + 2 + 3);"}, {"id": "expressions-3", "kind": "mcq", "prompt": "这段代码的两行输出分别是什么？", "options": ["true / true", "false / false", "false / true", "true / false"], "answer": 2, "explanation": "两次 new 创建两个 String 对象，因此 == 为 false；String.equals 比较字符内容，结果为 true。", "hint": "对象身份和文字内容是两个问题。", "tags": ["equals", "引用"], "code": "String a = new String(\"hi\");\nString b = new String(\"hi\");\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));"}, {"id": "expressions-4", "kind": "text", "prompt": "下面打印的数是多少？", "answer": ["24"], "explanation": "左边 n++ 交出 4，并把 n 改为 5；右边 ++n 先把 n 改为 6，再交出 6；乘积为 24，执行完 n 为 6。", "hint": "分别记录“表达式值”和“变量新值”。", "tags": ["自增", "追踪"], "code": "int n = 4;\nSystem.out.println(n++ * ++n);"}, {"id": "expressions-5", "kind": "mcq", "prompt": "哪一个条件在 n=0 时可以安全避免执行整数除法 10/n？", "options": ["10 / n > 2 && n != 0", "n != 0 && 10 / n > 2", "n != 0 & 10 / n > 2", "n == 0 && 10 / n > 2"], "answer": 1, "explanation": "只有第二项先判断 n!=0，并借助 && 在 false 时跳过右侧。单个 & 对 boolean 两边都求值。", "hint": "保护条件必须先执行，并且要能短路。", "tags": ["短路", "异常"]}]}, {"id": "flow", "title": "控制流与方法：像电脑一样逐行执行", "subtitle": "把 if、循环、方法调用和递归变成可以手工追踪的小步骤。", "minutes": 50, "source": [{"file": "W01_101_102.pdf", "pages": "47–54"}, {"file": "W02_101_102.pdf", "pages": "14"}], "objectives": ["按条件选择分支，而不是把所有分支都算一遍", "手工追踪 for、while、do-while 和 foreach", "分清参数、返回值、输出与局部作用域", "用“暂停调用”理解递归及其终止条件"], "sections": [{"title": "1 · if/else：每次走一条满足规则的路", "html": "<pre><code>int mark = 72;\nif (mark &gt;= 80) {\n    System.out.println(&quot;A&quot;);\n} else if (mark &gt;= 70) {\n    System.out.println(&quot;B&quot;);\n} else {\n    System.out.println(&quot;C or below&quot;);\n}<\/code><\/pre><p>从第一个条件开始。72 不满足 >=80，于是跳过第一个块；接着满足 >=70，打印 B；整条 if/else if/else 链结束，不会再执行 else。条件的排列很重要：如果先写 mark>=50，那么 90 也先落进该分支，后面的高分分支就没有机会。<\/p><p>多个彼此独立的 if 和一条 if/else if 链不同。独立 if 各自判断，所以一个数字可能让多个块都执行。阅读题目时先看清大括号和 else 属于谁，不要只凭缩进。<\/p><p>Java 允许某些单语句分支省略大括号，但初学时推荐统一保留。例如 <code>if (ok) printA(); printB();<\/code>只有 printA 受 if 控制，printB 总会执行。尤其不要在 if 的右括号后误加分号，那会让你以为受控的块实际上独立执行。<\/p>"}, {"title": "2 · switch：按一个值分情况，并留意 break", "html": "<pre><code>int day = 2;\nswitch (day) {\n    case 1:\n        System.out.println(&quot;Mon&quot;);\n        break;\n    case 2:\n        System.out.println(&quot;Tue&quot;);\n        break;\n    default:\n        System.out.println(&quot;Other&quot;);\n}<\/code><\/pre><p>这里把 day 与 case 标签匹配，day 为 2 时从 case 2 进入，打印 Tue，再由 break 离开 switch。default 处理没有匹配标签的情况。课程列出 switch 作为条件控制流的一种；你至少要能读懂经典写法。<\/p><p>经典冒号形式里，如果没有 break，执行可以继续进入后面的语句，这叫 fall-through。它有时用于合并情况，但也常是 bug。break 不是“跳过本行”，而是结束它所对应的 switch 或最近一层循环。新版 Java 还有箭头形式等写法，这里不拿不同写法混淆基础例子。<\/p><p>当条件是连续区间，如分数大于等于 80，if/else 通常更直接；当是同一个值的若干离散情况，如命令是 1、2、3，switch 可能更清楚。重点不是背哪种更高级，而是能表达同一个选择规则。<\/p>"}, {"title": "3 · for 的四个时间点：初始化、判断、执行、更新", "html": "<pre><code>int total = 0;\nfor (int i = 1; i &lt;= 3; i++) {\n    total = total + i;\n}\nSystem.out.println(total); // 6<\/code><\/pre><p>for 圆括号的三段依次是初始化、条件和更新。初始化只做一次；每一轮先检查条件，true 才进入循环体；循环体结束后做更新，再回去判断。上例 i=1 加 1；i=2 加 2；i=3 加 3；更新到 4 后条件 false，循环结束。<\/p><table><thead><tr><th>进入本轮时 i<\/th><th>进入前 total<\/th><th>本轮结束 total<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>6<\/td><\/tr><\/tbody><\/table><p>累计变量 total 必须在循环外初始化；若每轮都重新设为 0，就无法累计。<code>i &lt; 3<\/code>只进入 i=1、2 两轮，<code>i &lt;= 3<\/code>进入三轮。数循环次数时写出真正进入循环体的 i 值，比盯着符号猜快。<\/p>"}, {"title": "4 · while、do-while、foreach 与边界", "html": "<pre><code>int n = 3;\nwhile (n &gt; 0) {\n    System.out.println(n);\n    n--;\n}\n\nint[] values = {2, 4, 6};\nfor (int value : values) {\n    System.out.println(value);\n}<\/code><\/pre><p>while 先判断，再决定是否执行；如果第一次条件就是 false，循环体一次也不执行。do-while 先执行一次，再判断，所以至少执行一次。上面的 while 打印 3、2、1；忘记 n--，条件永远保持 true，就会形成无限循环。<\/p><p>foreach 的 <code>for (int value : values)<\/code>表示依次取出数组元素的值。每一轮，局部变量 value 接收一个元素值。它很适合“对每个元素做某事”，但不会自动提供元素下标。若要用 i 修改 <code>values[i]<\/code>或同时看邻居，普通 for 往往更清楚。<\/p><p>数组下标循环通常写 <code>i = 0; i &lt; values.length; i++<\/code>，不是 <=。break 结束最近的一层循环；continue 跳过这一次循环体剩余部分并进入后续循环流程。嵌套循环要分别记录内外层变量；外层每前进一步，内层通常重新从自己的初始化开始。<\/p>"}, {"title": "5 · 方法是一个有名字的小任务：参数进来、结果出去", "html": "<pre><code>public static int add(int a, int b) {\n    int sum = a + b;\n    return sum;\n}\n\n// 在 main 中：\nint answer = add(2, 5);\nSystem.out.println(answer); // 7<\/code><\/pre><p><code>int<\/code>在方法名前表示返回值类型；a、b 是形参，调用时的 2、5 是实参。调用 add 时，a 得到 2，b 得到 5；执行方法体算出 sum=7；return 把 7 交回调用处；于是 answer=7。调用方法时，主流程暂时等待，等该次调用结束后再继续。<\/p><p>打印和返回要分开。只在方法里 println(7)，不意味着调用方可以收到数值 7。反过来，只写 return 7，也不会自动显示到屏幕。一个 void 方法可以打印、修改对象或完成其他动作，只是不能返回带结果值的 return；可以用不带值的 <code>return;<\/code>提前结束。<\/p><p>这里 add 是 static，所以可在同类 static main 内直接调用，不必先 new 对象。后面会学实例方法，它要依附特定对象。先把“输入 → 过程 → 返回”这个调用机制弄清，再添加对象这一层。<\/p>"}, {"title": "6 · 局部作用域与签名：同名不等于同一份变量", "html": "<p>一个方法里的局部变量，只在它的合法作用域里存在。main 的 x 和另一个方法的 x 可以同名，却是不同变量。方法调用会创建本次调用自己的参数和局部变量，不会因为名称一样就自动共享。大括号还会限制块内局部变量的作用域，例如 for 初始化里声明的 i 通常不能在循环外继续读。<\/p><pre><code>public static int twice(int x) {\n    x = x * 2;\n    return x;\n}\n\n// 在 main 中：\nint x = 3;\nint y = twice(x);\nSystem.out.println(x); // 3\nSystem.out.println(y); // 6<\/code><\/pre><p>把 main 的 x 值 3 交给 twice 的参数 x，不是把 main 的变量本身搬过去。方法把自己的 x 改成 6，然后返回 6；main 的 x 仍为 3。这个机制就是下一章“值传递”的入口。<\/p><p>基础层面的重载依靠方法名和参数类型列表区分，例如 <code>add(int,int)<\/code>与 <code>add(double,double)<\/code>。只改变返回类型，不能成为一个合法的重载区别。调用时先看实参的编译期类型，再讨论哪一个重载适用。<\/p>"}, {"title": "7 · 递归：每次调用都先暂停，直到最底层有答案", "html": "<pre><code>public static int factorial(int n) {\n    if (n == 0) {\n        return 1;\n    }\n    return n * factorial(n - 1);\n}\n// 本例要求 n &gt;= 0；factorial(3) 得到 6<\/code><\/pre><p>递归是方法在执行过程中再次调用自己。它必须有能直接回答的基本情况，并且递归调用应朝基本情况前进。这里 n=0 直接返回 1；其他非负 n 调用 n-1。不要一看到方法名又出现就整段重头乱读，要把每一次调用当作独立的一层。<\/p><p>factorial(3) 暂停等待 <code>3 * factorial(2)<\/code>；factorial(2) 等待 <code>2 * factorial(1)<\/code>；factorial(1) 等待 <code>1 * factorial(0)<\/code>；factorial(0) 返回 1。然后依次向外恢复：1×1=1，2×1=2，3×2=6。这是“先向下调用，再向上返回”。<\/p><p>如果传入负数，这份基础版本不会走到 n==0，最终可能栈溢出；因此要说明前提或增加检查。int 能表示的数也有限，大阶乘会溢出。终止和数值范围是两件事：能够结束，不代表答案没有超出类型范围。<\/p>"}, {"title": "8 · 一套通用的读代码流程", "html": "<p>先看方法整体要做什么，再严格执行：①列出初始变量；②遇到赋值先算右边；③遇到条件写 true/false；④遇到循环记每一轮；⑤遇到方法另开一张“本次参数/局部变量”小表；⑥return 后把结果放回调用位置；⑦只有 print/println 才记录对应屏幕输出。<\/p><p>练习时建议先遮住解释，写下自己的输出和每一步值，再展开答案。如果只看解析觉得“我懂了”，换个数字往往还是会错。每次错误都写成一句可执行的检查规则，例如“数组最后下标是 length-1”“整数除法先发生，不会被接收变量改成浮点除法”。<\/p><p>这一章的补充代码把课件提到的控制流展开为零基础步骤。它不是对实际考试题型或范围的保证；复习主线仍对应你提供的 W01–W07 材料。后面的练习会反复使用这些同一套追踪动作，而不是不断发明新技巧。<\/p>"}], "quiz": [{"id": "flow-1", "kind": "text", "prompt": "下面输出什么？", "answer": ["B"], "explanation": "第一条件 false，第二条件 true，打印 B 后离开整条 if/else if/else 链。", "hint": "这是一条选择链，不是三个独立 if。", "tags": ["条件", "控制流"], "code": "int x = 7;\nif (x >= 10) { System.out.println(\"A\"); }\nelse if (x >= 5) { System.out.println(\"B\"); }\nelse { System.out.println(\"C\"); }"}, {"id": "flow-2", "kind": "text", "prompt": "循环结束后 total 是多少？", "answer": ["6"], "explanation": "i 依次为 0、1、2、3，共四轮；total=0+0+1+2+3=6。i 变为 4 时条件 false。", "hint": "把真正进入循环体的 i 列出来。", "tags": ["for", "累加"], "code": "int total = 0;\nfor (int i = 0; i < 4; i++) {\n    total += i;\n}"}, {"id": "flow-3", "kind": "mcq", "prompt": "第一次检查时条件就是 false，哪种循环仍至少执行一次循环体？", "options": ["while", "普通 for", "do-while", "所有循环都至少一次"], "answer": 2, "explanation": "do-while 先执行循环体再判断；while 和普通 for 在进入循环体前先判断条件。", "hint": "关注判断条件发生在循环体之前还是之后。", "tags": ["循环", "边界"]}, {"id": "flow-4", "kind": "mcq", "prompt": "main 中的 x 与 y 最后分别是多少？", "options": ["3 和 6", "6 和 6", "3 和 3", "无法编译，因为参数和局部变量都叫 x"], "answer": 0, "explanation": "方法参数接收值 3 的副本，修改的是本次调用的参数；return 6 被存到 y，main 的 x 没改。", "hint": "同名变量可能属于不同方法调用。", "tags": ["方法", "值传递"], "code": "static int twice(int x) { x *= 2; return x; }\n// main:\nint x = 3;\nint y = twice(x);"}, {"id": "flow-5", "kind": "text", "prompt": "下面调用 f(3) 返回多少？", "answer": ["6"], "explanation": "f(3)=3+f(2)，f(2)=2+f(1)，f(1)=1+f(0)，f(0)=0；向外返回为 1、3、6。", "hint": "先追到基本情况，再逐层代回。", "tags": ["递归", "return"], "code": "static int f(int n) {\n    if (n == 0) return 0;\n    return n + f(n - 1);\n}"}]}, {"id": "references", "title": "引用、数组与值传递：把内存画出来", "subtitle": "用“变量里装的值”和“对象里的内容”两层结构，拆开最容易混淆的概念。", "minutes": 60, "source": [{"file": "W02_101_102.pdf", "pages": "5–13、21–25、31–32"}], "objectives": ["区分基本类型变量、引用变量和对象本身", "解释为什么改数组元素会影响调用者，重绑参数却不会", "正确使用数组、二维数组和 ArrayList", "区分未初始化、null、共享引用和独立对象"], "sections": [{"title": "1 · 引用不是对象：先画两列", "html": "<pre><code>int x = 10;\nint y = x;\ny = 20;\n\nint[] a = {10, 20};\nint[] b = a;\nb[0] = 99;<\/code><\/pre><p>基本类型的 x 里保存数值 10。<code>y=x<\/code>把这个数值复制给 y；之后把 y 改成 20，x 仍是 10。对数组则不同：a 里保存一个指向数组对象的引用值。<code>b=a<\/code>复制这个引用值，因此 a 和 b 指向同一个数组对象；它并没有复制一份数组元素。<\/p><p>可以给对象起教学编号 A1，而不是猜真实地址：a→A1，b→A1，A1 的内容是 [10,20]。执行 b[0]=99 是沿着 b 到 A1，修改 A1 的第 0 个元素，所以通过 a 看到的也是 [99,20]。这种多个名字通向同一对象的情况叫别名或共享引用。<\/p><p>引用可以用“地址标签”类比，但不要把示意编号当成 Java 承诺公开的物理内存地址。解决考试题只需要知道“相同对象还是不同对象”，不需要计算实际机器地址。变量、引用值、对象内容分开画，后面的题就会稳定很多。<\/p>"}, {"title": "2 · 重新赋值和修改对象：两种完全不同的箭头动作", "html": "<pre><code>int[] a = {1, 2};\nint[] b = a;\nb[0] = 7;\nb = new int[] {9, 9};\nSystem.out.println(a[0]); // 7\nSystem.out.println(b[0]); // 9<\/code><\/pre><p>先创建对象 A1=[1,2]，a→A1，接着 b→A1。<code>b[0]=7<\/code>改的是 A1 内部的格子，所以 A1=[7,2]。下一行 new 创建另一个对象 A2=[9,9]，随后 b 的引用值被改成指向 A2；a 的引用值没有被改，仍指向 A1。<\/p><p>读到 <code>b=...<\/code>时，通常是在改变量 b 保存的值；读到 <code>b[0]=...<\/code>时，是通过引用修改某个数组元素。类似地，<code>person.age=...<\/code>修改的是对象字段，而 <code>person=new Person(...)<\/code>让 person 改指向。左边写的是什么，是你判断动作的关键。<\/p><p>如果需要独立数组，应明确创建或复制，例如 <code>int[] b=a.clone();<\/code>对一维 int 数组会得到独立的元素存储。对象数组或二维数组的浅拷贝仍可能共享内部对象，所以不要看到 clone 就一概认定所有层都完全独立。<\/p>"}, {"title": "3 · Java 一律值传递：复制的值可能恰好是引用", "html": "<pre><code>static void changeNumber(int n) {\n    n = 99;\n}\nstatic void changeFirst(int[] values) {\n    values[0] = 99;\n}\nstatic void replace(int[] values) {\n    values = new int[] {8, 8};\n}\n// main 中：\nint n = 1;\nint[] a = {1, 2};\nchangeNumber(n);\nchangeFirst(a);\nreplace(a);\n// n 仍为 1；a[0] 为 99<\/code><\/pre><p>调用方法时，实参求值，把得到的值复制到本次调用的形参。int 实参复制的是整数；数组或对象实参复制的是引用值。这两种情况都遵守同一条规则，所以 Java 并没有在对象出现时突然切换成“传引用变量本身”。<\/p><p>changeNumber 的 n 是独立参数，赋成 99 不会改 main 的 n。changeFirst 的 values 收到通向原数组的引用副本，因此它能沿着这条引用改共享数组元素。replace 把自己的 values 改指向新数组，但 main 的 a 保存的引用并没有被赋值，仍指向原数组。<\/p><p>检验理解的方法是试着写 swap：只在方法里用临时变量交换两个对象参数，不能交换调用者那两个变量保存的引用。参数里的箭头换了位置，不等于调用者的箭头也换了。要改变调用者的变量，常见办法是返回结果，让调用者自己接收并赋值。<\/p>"}, {"title": "4 · 数组：固定长度、同一元素类型、从 0 编号", "html": "<pre><code>int[] scores = new int[3];\nscores[0] = 80;\nscores[1] = 90;\nSystem.out.println(scores[2]); // 0\nSystem.out.println(scores.length); // 3\nfor (int i = 0; i &lt; scores.length; i++) {\n    System.out.println(scores[i]);\n}<\/code><\/pre><p>new int[3] 创建一个长度为 3 的数组对象，元素默认是 0。合法下标是 0、1、2；scores[3] 超界。数组的长度在这个对象创建之后固定，不能直接把同一个数组对象延长。但变量 scores 可以重新指向另一个长度不同的数组，因为那是另一个对象。<\/p><p>数组用 <code>.length<\/code>字段，没有小括号；String 常用 <code>.length()<\/code>方法；ArrayList 常用 <code>.size()<\/code>。这三个名字相似，却分别来自不同类型的接口。每个数组元素也像一个独立变量：int[] 元素存 int，Person[] 元素存 Person 引用。<\/p><p>注意默认值规则：新建 int 数组元素是 0，boolean 数组元素是 false，引用数组元素是 null；但 <code>int[] scores;<\/code>只声明一个局部引用变量，并未创建数组，也不能直接读取这个尚未初始化的局部变量。<\/p>"}, {"title": "5 · null 与对象数组：有三个格子不等于有三个人", "html": "<pre><code>Person[] people = new Person[3];\n// people 是数组引用；people[0]、[1]、[2] 目前都是 null\nfor (int i = 0; i &lt; people.length; i++) {\n    people[i] = new Person(&quot;Student &quot; + i);\n}<\/code><\/pre><p>new Person[3] 创建的是一个“装着三个 Person 引用的数组对象”，没有自动执行三次 Person 构造器。每个引用元素初始为 null；null 表示该引用当前不指向对象。必须像循环中那样逐个 new Person，才真正有三个 Person 实例。<\/p><p><code>Person p;<\/code>作为局部变量，是声明但未初始化；<code>Person p=null;<\/code>是已初始化，值为 null；<code>Person p=new Person(\"Amy\");<\/code>是引用着一个对象。前两种不能混同：读取未初始化局部变量是编译问题，对 null 调方法通常是运行时 NullPointerException。<\/p><p>也不要在循环外只 new 一个人，再把同一引用放进三个格子，误以为创建了三个人。如果三个元素都指向同一个 P1，修改 people[0] 所指对象的名字，通过 people[1] 看到的也会变。对象数量要数 new 的执行次数，并结合是否确实创建新实例。<\/p>"}, {"title": "6 · 二维数组：外层数组装着行引用", "html": "<pre><code>int[][] grid = {{1, 2}, {3, 4, 5}};\nSystem.out.println(grid.length);    // 2 行\nSystem.out.println(grid[1].length); // 第 2 行有 3 列\nSystem.out.println(grid[1][2]);     // 5<\/code><\/pre><p>Java 的二维数组可以理解为“数组的数组”。外层 grid 有两个元素，每个元素引用一个 int[] 行数组。行的长度可以不同，所以不能无条件认为所有行都与 grid[0] 一样长。访问 grid[r][c] 时，先沿外层找到第 r 行，再在该行找第 c 列。<\/p><p>遍历时用外层行数控制 r，再用 <code>grid[r].length<\/code>控制当前行的 c。<code>new int[2][3]<\/code>会创建有两行、每行三个 int 元素的规则结构；<code>new int[2][]<\/code>则仅建立外层，两条行引用仍为 null，需要再初始化各行。<\/p><p>拷贝外层引用数组不会自动拷贝所有行。例如 <code>int[][] copy=grid.clone();<\/code>让 copy 与 grid 拥有不同的外层数组，但对应行引用仍可指向同样的行对象。遇到多层结构，每一层都画箭头，而不是只画一个大方框。<\/p>"}, {"title": "7 · ArrayList：元素个数可以变化，但规则依然明确", "html": "<pre><code>import java.util.ArrayList;\n\nArrayList&lt;String&gt; names = new ArrayList&lt;&gt;();\nnames.add(&quot;Amy&quot;);\nnames.add(&quot;Bo&quot;);\nnames.set(0, &quot;Ana&quot;);\nSystem.out.println(names.get(0)); // Ana\nSystem.out.println(names.size()); // 2\nnames.remove(1);<\/code><\/pre><p>ArrayList 是可调整大小的列表。<code>&lt;String&gt;<\/code>告诉编译器这个列表装 String 引用；<code>new ArrayList&lt;&gt;()<\/code>创建列表对象。add 添加元素，get 按下标取元素，set 替换已有位置，size 给当前元素个数，remove 可以删除。set 不等于扩容：空列表里 set(0,...) 仍会超界。<\/p><p>Java 泛型类型参数需要引用类型，所以写 <code>ArrayList&lt;Integer&gt;<\/code>，不能写 ArrayList&lt;int&gt;。Integer 是 int 的包装类；自动装箱/拆箱让很多操作看起来像直接使用整数，但类型仍有区别。特别是 Integer 为 null 时拆箱会出问题。<\/p><p><code>ArrayList&lt;Integer&gt;<\/code>的 remove 有个常见陷阱：<code>remove(1)<\/code>按 int 参数解释为删除下标 1；<code>remove(Integer.valueOf(1))<\/code>才表达删除值为 1 的对象。索引题要先看实参类型，再看方法含义。<\/p>"}, {"title": "8 · 用四个问题解决所有基础引用题", "html": "<p>每看一行，问：①是否创建了新对象？②是否只复制了一个引用值？③是否修改了某个变量的引用？④是否沿引用修改了现有对象内部的字段或元素？把每个对象编成 A1、A2，把每个变量画成独立盒子，就能精确看到共享在哪里。<\/p><p>方法调用时，额外画一层参数盒子：caller 的 a→A1，callee 的 values→A1。两个盒子独立，箭头终点相同。修改 values 盒子，不会修改 a 盒子；修改 A1 的内容，两边都能观察到。返回后，方法参数盒子结束生命周期，但调用者仍可能持有 A1。<\/p><p>这一章最应避免的口头捷径是“Java 对象是引用传递”。它可能让你在改对象字段的题里侥幸猜对，却在重绑参数题里答错。请用完整表述：Java 总是值传递；对引用类型，复制的值是引用。<\/p>"}], "quiz": [{"id": "references-1", "kind": "text", "prompt": "最后输出什么？", "answer": ["9"], "explanation": "b=a 复制引用，a 与 b 指向同一个数组；b[0]=9 修改共享对象，因此 a[0] 也为 9。", "hint": "这段代码只有一次数组创建。", "tags": ["别名", "数组"], "code": "int[] a = {1, 2};\nint[] b = a;\nb[0] = 9;\nSystem.out.println(a[0]);"}, {"id": "references-2", "kind": "text", "prompt": "最后输出什么？", "answer": ["1"], "explanation": "replace 内部把形参 x 改指向一个新数组，未对调用者 a 重新赋值，原数组内容也未修改。", "hint": "方法参数是一个独立变量，里面的初始引用值来自复制。", "tags": ["值传递", "重绑定"], "code": "static void replace(int[] x) { x = new int[]{9}; }\n// main:\nint[] a = {1};\nreplace(a);\nSystem.out.println(a[0]);"}, {"id": "references-3", "kind": "mcq", "prompt": "执行 Person[] p = new Person[3]; 后，已经创建了几个 Person 实例？", "options": ["0", "1", "3", "取决于数组下标从几开始"], "answer": 0, "explanation": "只创建了装 Person 引用的数组，三个元素默认都是 null。需要逐次 new Person(...) 才会创建 Person 实例。", "hint": "数组对象与数组元素所引用的对象是两层。", "tags": ["对象数组", "null"]}, {"id": "references-4", "kind": "mcq", "prompt": "哪个写法用来读取 ArrayList<String> names 的当前元素个数？", "options": ["names.length", "names.length()", "names.size()", "names.count"], "answer": 2, "explanation": "ArrayList 用 size()；数组用 length 字段；String 常用 length() 方法。", "hint": "方法属于具体类型，不要只凭名字相近。", "tags": ["ArrayList", "API"]}, {"id": "references-5", "kind": "text", "prompt": "最后一行输出什么？", "answer": ["7"], "explanation": "二维数组的外层 clone 是浅拷贝：两个外层数组共享行引用，因此 b[0][0] 修改的行也由 a[0] 指向。", "hint": "每一层分别问：新建的是外层，还是连内部行也复制了？", "tags": ["二维数组", "浅拷贝"], "code": "int[][] a = {{1, 2}};\nint[][] b = a.clone();\nb[0][0] = 7;\nSystem.out.println(a[0][0]);"}]}, {"id": "objects", "title": "类、对象与封装：让数据和规则住在一起", "subtitle": "从一个具体的 BankAccount 出发，读懂构造器、this、实例成员、static 与最基本的 UML。", "minutes": 55, "source": [{"file": "W02_101_102.pdf", "pages": "16–64"}], "objectives": ["分清类、对象、字段、构造器和方法", "解释 this 指向谁以及参数与字段同名时的写法", "用私有字段和带校验的方法维护对象规则", "区分每个对象一份的实例状态与全类共享的 static 状态"], "sections": [{"title": "1 · 类是定义，对象是一个具体实例", "html": "<p>把 Student 作为类时，我们定义“一个学生对象需要保存什么、可以做什么”。例如保存名字 name 和年级 year，可以调用 getName、advanceYear。具体的 Amy 和 Bo 是两个实例，它们遵循同一个类的定义，却各有自己的字段值。<\/p><pre><code>class Student {\n    String name;\n    int year;\n}\n\nStudent a = new Student();\nStudent b = new Student();\na.name = &quot;Amy&quot;;\nb.name = &quot;Bo&quot;;<\/code><\/pre><p>上面执行了两次 new，产生两个 Student 对象。a 和 b 是引用变量，不是对象本体；每个对象分别有 name 和 year。改 a.name 不会自动改 b.name，除非 a 与 b 实际指向同一个对象。类是共同的定义，引用是通向实例的值，实例状态属于具体对象。<\/p><p>字段用于保存对象跨方法调用仍需保留的状态；方法内临时算出的局部变量只属于那次调用。理解这一点后，你会知道“余额”应是账户字段，而“本次想提款多少”应是 withdraw 的参数，不该都堆成全局变量。<\/p>"}, {"title": "2 · 抽象：先根据用途决定保留什么", "html": "<p>抽象不是把代码写得难懂，而是在某个具体用途下，选出有意义的属性和行为。健康应用中的 Food 可能需要热量和蛋白质；库存系统中的 Food 则可能需要价格、数量、保质期。同样叫“食物”，模型也会因任务不同而不同。<\/p><p>建模 Student 时，课程管理系统常需学号、选课、成绩；游戏喜好可能无关。但如果开发社交应用，喜好又可能成为核心字段。不要机械地把现实对象的所有信息塞进类。先问系统需要回答什么问题，再决定必须保存什么、哪些行为由谁负责。<\/p><p>课件中的 Balloon 可以保存 colour、volume、isPopped、capacity。它不只是一袋无关变量：inflate 应怎样改变 volume，达到 capacity 时怎样处理，都应该与模型规则一致。一个对象应负责维护自己那部分相关状态，这会自然引向封装。<\/p>"}, {"title": "3 · 构造器：new 时初始化，名字相同且没有返回类型", "html": "<pre><code>class Student {\n    private String name;\n    private int year;\n\n    public Student(String name, int year) {\n        this.name = name;\n        this.year = year;\n    }\n\n    public Student(String name) {\n        this(name, 1);\n    }\n}\n// new Student(&quot;Amy&quot;) 与 new Student(&quot;Bo&quot;, 2)<\/code><\/pre><p>构造器名称必须与类名相同，而且没有返回类型，连 void 也不写。<code>void Student(...)<\/code>是一个普通方法声明，不是构造器。new 触发对象创建过程并调用匹配参数列表的构造器，让对象从一开始就拥有合理的字段状态。<\/p><p>可以声明多个参数类型列表不同的构造器，这叫构造器重载。上面的单参数构造器调用双参数版本，把默认年级设为 1。课程经典写法中，<code>this(...)<\/code>放在构造器体开头，集中复用初始化逻辑。不要与 <code>this.name<\/code>混淆：一个是调用本类另一构造器，一个是访问当前对象字段。<\/p><p>如果类完全没有声明任何构造器，编译器会按规则提供默认无参构造器；一旦你声明了某个构造器，就不能想当然认为无参版本仍会自动存在。例如只写 Student(String) 后，new Student() 不会凭空匹配成功。<\/p>"}, {"title": "4 · this：当前正在接收这次调用的对象", "html": "<pre><code>class Counter {\n    private int value;\n\n    public Counter(int value) {\n        this.value = value;\n    }\n    public void increment() {\n        this.value++;\n    }\n    public int getValue() {\n        return this.value;\n    }\n}<\/code><\/pre><p>构造器参数 value 与字段 value 同名时，单独写 value 优先指参数；<code>this.value<\/code>明确指当前对象的字段。于是 <code>this.value=value<\/code>是“把参数值存入当前对象字段”。如果写成 value=value，只是把参数自己赋给自己，字段没有得到你想存的值。<\/p><p>当调用 <code>a.increment()<\/code>时，这次方法执行中的 this 指向 a 所引用的 Counter；调用 <code>b.increment()<\/code>时，this 指向 b 引用的对象。并不是每个对象都要复制一份方法源代码；关键在于同一段实例方法根据不同接收者操作不同实例状态。<\/p><p>static 方法不依附某个特定对象，所以不能直接使用 this，也不能无条件直接访问某个实例字段。需要实例状态时，先明确是哪一个对象，例如 main 里创建 Counter c，再调用 c.increment()。<\/p>"}, {"title": "5 · 封装：让对象维护自己的规则，而不只是藏字段", "html": "<pre><code>class BankAccount {\n    private int balance; // 用整数示范基本规则\n\n    public BankAccount(int initialBalance) {\n        if (initialBalance &lt; 0) {\n            throw new IllegalArgumentException(&quot;negative balance&quot;);\n        }\n        this.balance = initialBalance;\n    }\n    public int getBalance() { return balance; }\n    public boolean withdraw(int amount) {\n        if (amount &lt;= 0 || amount &gt; balance) {\n            return false;\n        }\n        balance -= amount;\n        return true;\n    }\n}<\/code><\/pre><p>如果 balance 是 public，外部代码可以随时设成负数，账户自身无法保证规则。private 限制外部直接访问，让所有合法变化经过类提供的操作。withdraw 不仅执行减法，还定义“金额必须为正且不超过余额”；返回值告诉调用者是否成功。<\/p><p>构造器检查初始状态，方法检查后续变化，两者合起来维护对象不变式：本例 balance 保持非负。仅写一个不检查的 <code>setBalance(int balance)<\/code>再把字段设成 private，仍允许外部通过 setter 传入负数，因此不能把“有 getter/setter”当作封装质量的充分证明。<\/p><p>这里使用整数帮助说明规则，暂不处理真实金融系统的货币、溢出等完整要求。你要学会的是责任归属：提款规则应该由 BankAccount 统一管理，而不是要求每个 ATM、网页、测试都自行猜出相同规则。<\/p>"}, {"title": "6 · 访问权限与 package：谁可以看见谁", "html": "<table><thead><tr><th>写法<\/th><th>入门理解<\/th><\/tr><\/thead><tbody><tr><td>public<\/td><td>在类型可访问等条件满足时，可供外部代码访问。<\/td><\/tr><tr><td>private<\/td><td>类内部实现细节；普通外部调用者不能直接访问。<\/td><\/tr><tr><td>不写修饰符<\/td><td>package-private，面向同一 package 的代码。<\/td><\/tr><tr><td>protected<\/td><td>同包可访问，并为跨包子类提供受规则限制的访问。<\/td><\/tr><\/tbody><\/table><p>package 是组织类的命名空间。例如 java.util.ArrayList 的类名是 ArrayList，位于 java.util 包；import 让你在源代码中更方便地使用其短名，不是把所有对象都提前创建出来。自己的类也可以归入课程使用的包。<\/p><p>初学时可采用“字段尽可能私有，只把确实需要的操作公开”作为设计起点。protected 的跨包细节比“所有子类随时随地都能读”更严格，后续继承章再结合例子理解。权限控制解决的是可访问性，不会自动证明程序满足全部业务规则。<\/p><p>getter 不一定都应提供，setter 更不是每个字段都必须有。例如学号可能只允许初始化一次，内部缓存也可能不应直接暴露。接口应围绕调用者真正要完成的动作来设计。<\/p>"}, {"title": "7 · static 与实例成员：一份共享还是每人一份？", "html": "<pre><code>class Student {\n    private String name;\n    private static int count = 0;\n\n    public Student(String name) {\n        this.name = name;\n        count++;\n    }\n    public String getName() { return name; }\n    public static int getCount() { return count; }\n}\nStudent a = new Student(&quot;Amy&quot;);\nStudent b = new Student(&quot;Bo&quot;);\nSystem.out.println(Student.getCount()); // 2<\/code><\/pre><p>name 是实例字段：Amy 对象和 Bo 对象各有一份。count 是 static 字段：属于 Student 类，所有实例共享同一份。每执行一次构造器，修改同一个 count。这个计数器统计的是本例中的创建次数，并不会在某个引用变成 null 时自动减少。<\/p><p>实例方法 getName 必须知道“哪一个学生”，因此通常通过 a.getName() 调用。static 方法 getCount 访问类层面的状态，可用 Student.getCount()。Math.sqrt(25) 也是不依赖某个特定 Math 实例的操作。static 并不表示值永远不变；“不能重新赋值”涉及 final 等另一套规则。<\/p><p>不要为了在 main 里方便访问，就把所有字段都改成 static。那会让本来应独立的账户、学生或气球共享状态，产生互相影响。先判断数据属于“某个具体对象”还是“整个类”，再决定是否 static。<\/p>"}, {"title": "8 · UML 起步与一段完整调用的读法", "html": "<p>UML 类图用语言之外的图形表达设计。最基本的类框可分为类名、字段、方法三层；常见可见性符号 + 表示 public，- 表示 private，# 表示 protected。字段可写 <code>- balance : int<\/code>；方法可写 <code>+ withdraw(amount : int) : boolean<\/code>。它描述结构和关系，不负责自动执行程序。<\/p><p>课件给出三种关系口头判断：IS-A 是“某类型是另一类型的一种”，例如 Car 是 Vehicle；HAS-A 表示某对象拥有或包含另一个角色，例如 Car 有 Wheel；RESPONDS-TO 强调通过方法调用沟通。设计时先说清关系，再选继承、字段或调用。不是因为两个类“都用得到”彼此，就应该继承。<\/p><pre><code>BankAccount account = new BankAccount(100);\nboolean ok = account.withdraw(30);\nSystem.out.println(ok);                   // true\nSystem.out.println(account.getBalance()); // 70<\/code><\/pre><p>逐行连接本章全部概念：new 创建账户并用构造器初始化余额；account 保存引用；withdraw 的 this 指向该账户，amount 是本次调用参数；方法检查后修改私有实例字段；return true 交给 ok；getBalance 读取对象当前状态。这就是面向对象调用的基础闭环。<\/p>"}], "quiz": [{"id": "objects-1", "kind": "mcq", "prompt": "哪一个是 Student 类的合法构造器声明？", "options": ["public void Student(String name) { }", "public Student(String name) { }", "public int Student(String name) { return 0; }", "public new Student(String name) { }"], "answer": 1, "explanation": "构造器与类同名，而且没有返回类型；加 void 会变成普通方法，加 int 也不是构造器。", "hint": "注意“没有返回类型”和“返回类型是 void”的区别。", "tags": ["构造器", "语法"]}, {"id": "objects-2", "kind": "mcq", "prompt": "为什么下面这行不能正确把参数保存到字段？", "options": ["因为 private 字段在构造器中也不能改", "因为 name=name 两侧都指参数，应该写 this.name=name", "因为 String 不能作为字段", "因为构造器必须 return name"], "answer": 1, "explanation": "参数遮蔽了同名字段；name=name 只是参数赋给自身。this.name 明确选择当前对象的字段。", "hint": "区分参数盒子和对象字段。", "tags": ["this", "字段"], "code": "class Student {\n    private String name;\n    Student(String name) { name = name; }\n}"}, {"id": "objects-3", "kind": "text", "prompt": "下面最后输出什么？", "answer": ["2"], "explanation": "count 属于 Counter 类，两个构造器调用递增同一份 count，因此是 2；实例字段才会每个对象各一份。", "hint": "数一数 new 执行几次，并确认 count 是否 static。", "tags": ["static", "共享状态"], "code": "class Counter {\n    static int count = 0;\n    Counter() { count++; }\n}\n// main:\nnew Counter();\nnew Counter();\nSystem.out.println(Counter.count);"}, {"id": "objects-4", "kind": "mcq", "prompt": "目标是余额始终非负，哪种设计更能维护规则？", "options": ["balance 设 public，要求所有调用者自觉", "balance 设 private，再提供不检查的 setBalance", "balance 设 private，由构造器和 withdraw 等方法检查合法变化", "给 balance 换一个更长的名字"], "answer": 2, "explanation": "private 限制外部直接写入，而构造器和方法校验负责维护合法状态。无校验 setter 仍可传入负值。", "hint": "隐藏字段与验证状态变化需要一起做。", "tags": ["封装", "不变式"]}, {"id": "objects-5", "kind": "mcq", "prompt": "关于对象和类，哪句话正确？", "options": ["每次 new 都是在修改类的全部定义", "两个不同 Student 实例必定共享所有实例字段", "类描述共同结构，实例各自拥有实例状态", "static 字段永远不能修改"], "answer": 2, "explanation": "类定义共同结构和行为；各对象的实例字段独立，而 static 字段属于类。static 不等于 final。", "hint": "区分定义、实例状态和类级共享状态。", "tags": ["类与对象", "static"]}]}, {"id": "inheritance", "title": "对象如何合作：关系、UML 与继承", "subtitle": "先想清楚谁是什么、谁拥有什么，再把关系写成 Java。", "minutes": 50, "source": [{"file": "W03_101_102.pdf", "pages": "3–40"}, {"file": "W04_101_102.pdf", "pages": "3–5、20–22"}, {"file": "W04-worksheet.pdf", "pages": "1"}], "objectives": ["从描述中区分 dependency、association、aggregation、composition 与 inheritance。", "把简单 UML 属性、方法和继承关系翻译成代码。", "按顺序追踪 super 构造器调用，判断访问是否允许。", "解释为什么复用代码不是滥用继承的充分理由。"], "sections": [{"title": "1. 为什么不把所有代码塞进一个类？", "html": "<p>设想你要写大学选课系统。如果把学生姓名、课程容量、教授工资、选课规则全部放进 <code>University<\/code>，修改一个规则就可能碰坏别的功能。课件把“大系统拆成职责明确的小对象”叫作 <strong>decomposition，分解<\/strong>。它的目标不是让文件越多越好，而是让每个类有一个能解释清楚的工作。<\/p><p>例如 <code>Student<\/code> 保存学生资料，<code>Course<\/code> 管理课程，<code>EnrollmentService<\/code> 处理选课过程。你先问“谁应该知道这件事、谁应该负责这件事”，再决定方法写在哪里。对象合作时，调用者只需要知道对方提供的方法，不必掌握对方内部实现。<\/p><p>课件中的汽水例子尤其适合入门：顾客调用 <code>bringSoda()<\/code>，表达“给我汽水”这个 <strong>what<\/strong>，这是抽象；服务者自己决定去超市还是自动售货机，并隐藏这个 <strong>how<\/strong>，这是封装。抽象让接口简单，封装让实现能变化；它们经常一起出现，但不是同一个词。<\/p>"}, {"title": "2. 临时用一下，还是长期保存？", "html": "<p><strong>Dependency，依赖<\/strong>表示某段代码需要另一种类型。例如方法接收 <code>Student<\/code> 和 <code>Course<\/code>，只是用它们完成一次操作。<strong>Association，关联<\/strong>表示对象之间具有持续的业务联系，常表现为对象字段保存另一个对象的引用。<\/p><pre><code>class EnrollmentService {\n    void enroll(Student s, Course c) {\n        c.addStudent(s);\n    }\n}\nclass Order {\n    private Customer customer;\n    Order(Customer customer) {\n        this.customer = customer;\n    }\n}<\/code><\/pre><p>第一段的 <code>s<\/code>、<code>c<\/code> 是每次调用收到的参数；第二段 <code>customer<\/code> 是订单对象保存的状态。两段都出现另一个类型，却不必画成相同的关系。<code>private Customer customer<\/code> 的意思是“订单有一条指向顾客的引用”，不是“把顾客对象完整复制进订单”。同一个顾客可以被多张订单引用。<\/p><p>做题时别只看到 <code>new<\/code> 或一个字段就机械下结论。先读情境：这个对象只是被使用、存在联系，还是代表整体的一部分？代码是模型的实现，关系的语义仍由问题背景决定。<\/p>"}, {"title": "3. 聚合和组合：重点看所有权与生命周期", "html": "<p><strong>Aggregation，聚合<\/strong>是一种较弱的整体—部分关系：部分能脱离整体独立存在。课程班级和学生是一个常见模型；班级撤销，学生仍存在。<strong>Composition，组合<\/strong>强调整体拥有部分，部分在这个模型里依附整体的生命周期，例如订单和只属于该订单的订单行。<\/p><table><thead><tr><th>关系<\/th><th>你应问的问题<\/th><th>典型 UML 标记<\/th><\/tr><\/thead><tbody><tr><td>关联<\/td><td>它们是否有业务联系？<\/td><td>实线<\/td><\/tr><tr><td>聚合<\/td><td>是整体—部分，但部分可独立存在吗？<\/td><td>整体端空心菱形<\/td><\/tr><tr><td>组合<\/td><td>部分是否由整体排他拥有、生命周期受整体管理？<\/td><td>整体端实心菱形<\/td><\/tr><\/tbody><\/table><p>“汽车和引擎”并没有脱离情境的唯一答案：库存系统里引擎可以先单独存在，另一种教学模型里则把它当作汽车内部部分。说明你的模型假设，比背一个现实世界配对更可靠。<\/p><p><strong>Java 不会因为你画了实心菱形，就自动级联删除对象。<\/strong> Java 用引用和垃圾回收管理内存；若别处仍持有一个部分的引用，它仍可能被访问。组合描述的是设计约束，你需要用构造方式、访问限制和所有权约定去维护它。<\/p>"}, {"title": "4. 读 UML：把图变成你会写的代码", "html": "<p>UML 类框通常分成类名、属性、方法三部分。<code>- radius : double<\/code> 读作“私有字段 radius，类型为 double”；<code>+ area() : double<\/code> 读作“公开方法 area，没有参数，返回 double”。<code>+<\/code> 表示 public，<code>-<\/code> 表示 private，<code>#<\/code> 表示 protected，<code>~<\/code> 表示包内访问。<\/p><pre><code>class Circle {\n    private double radius;\n    public Circle(double radius) {\n        this.radius = radius;\n    }\n    public double area() {\n        return Math.PI * radius * radius;\n    }\n}<\/code><\/pre><p>注意 UML 的 <code>radius : double<\/code> 与 Java 的 <code>double radius<\/code> 顺序相反。方法参数也一样：UML 的 <code>setRadius(r : double) : void<\/code> 对应 <code>void setRadius(double r)<\/code>。构造器与类同名，Java 里没有返回类型，不能写成 <code>void Circle(...)<\/code>。<\/p><p>继承用指向父类的空心三角箭头；实现接口通常用虚线和空心三角；依赖常用虚线箭头。多重性 <code>1<\/code>、<code>0..1<\/code>、<code>*<\/code> 分别表示一个、可有可无、多个。例如 <code>Airline 1 — * CrewMember<\/code> 要结合标注方向与情境读成数量约束，不能只凭线长猜关系。<\/p>"}, {"title": "5. 同型练习：把 Animal UML 逐步翻译成代码", "html": "<p>W04 worksheet 第 1 页练习把 Animal、Dog、Cat 的继承图转换成 Java。下面用同型的 Device、Printer、Scanner 帮你掌握方法；回到原图时请再按图中的名称、类型、可见性逐项核对。<\/p><p>假设图中 Device 有整数属性 power、接收整数的构造器 Device(int)，以及公开方法 operate():void；Printer(int) 和 Scanner(int) 都指向 Device 的继承三角箭头。先做一张翻译清单：类框→class；属性→字段；与类同名的方法→构造器；空心三角指向谁→extends 谁；返回类型 void→方法执行动作但不返回结果。<\/p><pre><code>class Device {\n    private int power;\n    Device(int power) { this.power = power; }\n    public void operate() { System.out.println(\"device operates\"); }\n}\nclass Printer extends Device {\n    Printer(int power) { super(power); }\n    @Override\n    public void operate() { System.out.println(\"printing\"); }\n}\nclass Scanner extends Device {\n    Scanner(int power) { super(power); }\n    @Override\n    public void operate() { System.out.println(\"scanning\"); }\n}<\/code><\/pre><p>第一步只写三个 class 壳和 extends，确认继承方向。第二步把 power 放在 Device 一次；子类不用重复声明共有状态。第三步写 Device(int)，注意构造器没有 void。第四步在两个子类构造器里用 super(power) 把数据交给父类；如果父类只有带参数构造器，就不能依赖自动 super()。第五步按题目需要实现或重写 operate，并保留兼容的可见性。上面的输出文字只是教学选择，原 UML 若只要求骨架，不必自行发明额外业务行为。<\/p><p>最后检验：<code>Device d = new Printer(20); d.operate();<\/code> 应通过声明类型检查，并由实际 Printer 对象给出行为。回到 worksheet 的 Animal(int)、numLimbs:int、makeSound():void 时，照同样五步处理。图没有说明的信息不要乱猜；UML 要求的字段可见性、构造器参数和返回类型应逐字对应。<\/p>"}, {"title": "6. extends：表达 IS-A，而不是“我想省几行”", "html": "<p>如果 <code>Circle<\/code> 是 <code>Shape<\/code> 的一种，才能用继承表达 <strong>is-a<\/strong>。若 <code>Event<\/code> 拥有一个 <code>Time<\/code>，那是 <strong>has-a<\/strong>，通常应保存字段。活动不是一种时间；把它写成 <code>Event extends Time<\/code> 只是为了复用时间代码，会让类型含义变得错误。<\/p><pre><code>class Shape {\n    private int x;\n    Shape(int x) { this.x = x; }\n    public int getX() { return x; }\n}\nclass Circle extends Shape {\n    private double radius;\n    Circle(int x, double radius) {\n        super(x);\n        this.radius = radius;\n    }\n}<\/code><\/pre><p><code>Circle<\/code> 对象既有 Shape 部分的状态，也有自己的 radius。它能使用公开的 <code>getX()<\/code>，不需要复制一份坐标字段。<code>private x<\/code> 仍由父类的代码管理；子类不能直接写 <code>this.x<\/code>。你可以通过公开或适当的受保护方法与它交互。<\/p><p>Java 的一个类只能 <code>extends<\/code> 一个直接父类，但一个父类可以有多个子类；一个类可以实现多个接口。未显式写 <code>extends<\/code> 的普通类会隐式继承 <code>Object<\/code>，因此也拥有 <code>toString()<\/code>、<code>equals()<\/code> 等基础方法。构造器不会被继承。<\/p>"}, {"title": "7. 构造顺序：先把父类部分建好", "html": "<p>创建子类对象时，父类部分也必须有效。入门时采用课件和课程代码使用的规则：在子类构造器开头显式写 <code>super(...)<\/code>，把父类需要的数据交给父类。若没有写显式构造器调用，编译器会尝试插入无参 <code>super()<\/code>；这不代表父类一定有无参构造器。<\/p><pre><code>class Parent {\n    Parent(int n) { System.out.println(\"P\" + n); }\n}\nclass Child extends Parent {\n    Child() {\n        super(7);\n        System.out.println(\"C\");\n    }\n}\n// 执行 new Child();\n// 输出：\n// P7\n// C<\/code><\/pre><p>沿调用链看：<code>new Child()<\/code> 进入 Child 构造过程；<code>super(7)<\/code> 完成 Parent 构造；回到 Child，执行打印 C。这里的 <code>super(7)<\/code> 不是又创建一个独立 Parent 对象，而是在初始化同一个 Child 对象的父类部分。<\/p><p>若删掉 <code>super(7)<\/code>，编译器尝试找 <code>Parent()<\/code>，而当前只定义了 <code>Parent(int)<\/code>，因此课程写法会编译失败。<code>this(...)<\/code> 则调用本类的另一个构造器；不能让构造器互相循环调用。<code>super.method()<\/code> 用于调用直接父类版本的方法，Java 不允许 <code>super.super.method()<\/code> 这种语法。<\/p>"}, {"title": "8. public、private、protected：从“我站在哪里”判断", "html": "<p>访问权限不是看对象“是不是存在”，而是看当前代码所在的类、包和继承关系。<code>package school;<\/code> 把类放入 school 命名空间；同包通常意味着相同 package 声明，不等于两个文件恰好放在屏幕上同一个文件夹。<\/p><table><thead><tr><th>修饰符<\/th><th>入门判断<\/th><\/tr><\/thead><tbody><tr><td>private<\/td><td>该声明所在类的代码可访问；子类不能仅凭继承直接访问父类私有字段。<\/td><\/tr><tr><td>无修饰符<\/td><td>package-private：同包可访问；不同包不可直接访问。<\/td><\/tr><tr><td>protected<\/td><td>同包可访问；不同包的子类也有受限制的继承访问权。<\/td><\/tr><tr><td>public<\/td><td>类型本身可见等条件满足时，可以公开访问。<\/td><\/tr><\/tbody><\/table><p>课件 W03 对“默认权限不能由子类访问”的说法是简化：<strong>同一个包里的子类可以访问父类 package-private 成员<\/strong>，W04 的包访问表给出更准确的判断。跨包 protected 也不是“所有子类里拿任何父类对象都能访问”；它主要支持对子类自身继承来的状态进行访问。遇到复杂题，先画出包与类的位置。<\/p><p>字段通常先设 private，再按需要提供方法。这样余额不能被任意写成负数，修改时可以统一检查。getter/setter 不是必须全配；若对象不应允许外部随意修改某值，就不要为了“看起来完整”添加 setter。<\/p>"}, {"title": "9. 设计自检：会解释模型，才算学会关系", "html": "<p>拿到场景后按四步走：先圈出实体，再写每个实体负责的事情，再确定对象之间需要怎样通信，最后选择关系。不要倒过来先画一排继承箭头，再硬找理由。<\/p><p>例如画图程序中 Circle 和 Rectangle 可以都属于 Shape；画布 Canvas <em>拥有一组<\/em> Shape，因此通常通过 <code>List&lt;Shape&gt;<\/code> 保存它们。Canvas 不应继承 Circle。若让“画圆的操作”对象临时调用 Canvas，它又可能只是依赖 Canvas。一个系统里同时出现多种关系很正常。<\/p><p>练习时请用一句完整的话解释每条箭头：“Circle 是一种 Shape，因此 extends；Canvas 保存图形供后续重绘，因此有字段；某方法临时接收 Shape，因此发生依赖。”如果只会说“这里连线，因为它们有关”，说明模型还不够清楚。<\/p><p>关系模型并不是 Java 自动保证的现实真理。继承提供语言机制，但“子类是否适合替代父类”还需要行为设计。后续讲接口、设计原则和模式时，你会不断用到这套从责任出发的思考方法。<\/p>"}], "quiz": [{"id": "inh-1", "kind": "mcq", "prompt": "“Event 有一个 Time 表示开始时间”，哪种设计最符合描述？", "options": ["class Event extends Time", "class Event { private Time start; }", "class Time extends Event", "把全部 Time 方法复制到 Event"], "answer": 1, "explanation": "has-a 通过字段表达。Event 不是一种 Time，不能只为复用代码建立错误的 is-a。", "hint": "把句子里的“有一个”与“是一种”分开读。", "tags": ["关系", "组合"]}, {"id": "inh-2", "kind": "mcq", "prompt": "运行 new Child() 的输出顺序是？", "options": ["C 然后 P7", "P7 然后 C", "只有 C", "编译失败"], "answer": 1, "explanation": "super(7) 先执行 Parent 构造器，再执行子类构造器中后续语句。父类部分和子类部分属于同一个新对象。", "hint": "从 super 调用进入父类，再返回子类。", "tags": ["继承", "构造器"], "code": "class Parent { Parent(int n) { System.out.println(\"P\" + n); } }\nclass Child extends Parent {\n  Child() { super(7); System.out.println(\"C\"); }\n}"}, {"id": "inh-3", "kind": "mcq", "prompt": "Parent 只有 Parent(int n) 构造器。Child 构造器既没有 this(...) 也没有 super(...)。按本课件的常规写法会怎样？", "options": ["自动给 n 传 0", "直接跳过父类构造器", "尝试隐式 super()，因不存在无参父类构造器而编译失败", "运行时抛 NullPointerException"], "answer": 2, "explanation": "定义了 Parent(int) 不会自动再得到 Parent()。子类需要显式调用可用的父类构造器，例如 super(0)。", "hint": "编译器会尝试补哪一种父类构造器调用？", "tags": ["构造器", "编译错误"]}, {"id": "inh-4", "kind": "mcq", "prompt": "父类的字段没有访问修饰符；子类和父类处于同一 package。子类能否直接访问该字段？", "options": ["不能，子类只能访问 public 或 protected", "可以，因为 package-private 允许同包访问", "可以，因为子类永远能直接访问所有字段", "只有字段为 static 才可以"], "answer": 1, "explanation": "无修饰符是 package-private。同包子类和同包其他类都拥有包访问权；不同包的子类不能仅凭继承访问它。", "hint": "区分“不同包子类”与“同包子类”。", "tags": ["访问权限", "package"]}, {"id": "inh-5", "kind": "mcq", "prompt": "课程班级撤销后，学生对象仍然独立存在；在这个模型里“班级—学生”更适合什么关系？", "options": ["继承", "聚合", "必定组合", "没有任何关系"], "answer": 1, "explanation": "这是较弱的整体—部分关系，部分可独立存在，因此聚合较合适。关系取决于模型情境。", "hint": "关注学生的生命周期是否依附班级。", "tags": ["UML", "聚合"]}, {"id": "inh-6", "kind": "mcq", "prompt": "UML 中 “- radius : double” 应翻译成哪种字段？", "options": ["public radius double;", "private double radius;", "protected void radius();", "double private radius();"], "answer": 1, "explanation": "减号表示 private；冒号后为类型。Java 写类型在前、名称在后。", "hint": "先翻译可见性，再翻译名称与类型。", "tags": ["UML"]}]}, {"id": "polymorphism", "title": "多态：编译器看类型，运行时看对象", "subtitle": "把“选哪个方法”拆成两个阶段，读输出题就不再靠猜。", "minutes": 55, "source": [{"file": "W03_101_102.pdf", "pages": "40–50"}, {"file": "W04_101_102.pdf", "pages": "7–27、43"}], "objectives": ["区分声明类型、实际对象类型与强制类型转换。", "分别判断重载选择、实例方法重写、字段遮蔽。", "正确理解 final，并写一个最小泛型类。", "用固定流程推导多态代码的输出或错误阶段。"], "sections": [{"title": "1. 一个引用有两种必须分开的类型", "html": "<pre><code>Animal a = new Dog();<\/code><\/pre><p>把这行拆成两半：左边 <code>Animal a<\/code> 规定变量 a 的<strong>声明类型<\/strong>，编译器据此检查“你能写哪些调用”；右边 <code>new Dog()<\/code> 创建<strong>实际类型为 Dog<\/strong> 的对象。a 保存指向这个对象的引用，不会把 Dog 对象改造成一份纯 Animal。<\/p><p>如果 Animal 声明了 <code>makeSound()<\/code>，那么 <code>a.makeSound()<\/code> 能通过检查；如果只有 Dog 才有 <code>fetch()<\/code>，那么直接写 <code>a.fetch()<\/code> 会编译失败，即便你知道 a 此刻指向 Dog。编译器检查的是变量类型提供的承诺，而不是替你猜每个时刻的对象。<\/p><p>这限制换来的是统一使用：<code>Animal[] animals = { new Dog(), new Cat() };<\/code>，同一个循环对每个元素调用 <code>makeSound()<\/code>。外层代码只依赖 Animal 提供的行为，内部各对象给出自己的实现。多态的价值就在于扩展对象种类时，不必到处增加“如果是狗……如果是猫……”。<\/p>"}, {"title": "2. Override：先确认调用合法，再由对象决定实现", "html": "<pre><code>class Animal {\n    public String sound() { return \"animal\"; }\n}\nclass Dog extends Animal {\n    @Override\n    public String sound() { return \"woof\"; }\n}\nAnimal a = new Dog();\nSystem.out.println(a.sound()); // woof<\/code><\/pre><p>第一阶段编译：Animal 里存在可访问、参数匹配的 <code>sound()<\/code>，因此调用合法。第二阶段运行：a 指向 Dog，Dog 重写了这个实例方法，因此运行 Dog 的版本。这叫动态分派，或运行时多态。<\/p><p>重写需要匹配方法名和参数类型。只把参数名从 x 改成 y 不影响签名；把参数类型改掉却通常变成重载。覆盖方法不能收紧访问权限，例如父类方法 public，子类不能改成 private。入门题多用完全相同返回类型；Java 也允许引用返回类型协变，即子类版本返回更具体的引用类型。<\/p><p><code>@Override<\/code> 是给编译器的核对请求：如果你拼错方法名、参数不符而没有真正重写，它会报告问题。它不负责“开启多态”；真正的继承关系和方法规则才是原因。<code>super.sound()<\/code> 明确调用父类实现，可用于在原行为基础上扩展。<\/p>"}, {"title": "3. Overload：同名不是同一个签名", "html": "<pre><code>class Printer {\n    void show(Animal x) { System.out.println(\"animal parameter\"); }\n    void show(Dog x) { System.out.println(\"dog parameter\"); }\n}\nAnimal pet = new Dog();\nnew Printer().show(pet); // animal parameter<\/code><\/pre><p>这次选择的是哪个<strong>参数版本<\/strong>，属于重载，编译阶段根据实参表达式的声明类型来选择。pet 的声明类型是 Animal，因此选 <code>show(Animal)<\/code>。右边对象实际上是 Dog，不会让运行时重新改选另一个重载签名。<\/p><p>这并不与上一节矛盾：<strong>先选择签名，再针对选中的实例方法签名决定是否存在子类重写<\/strong>。例如接收者也通过父类变量访问，且子类重写了刚选中的 <code>show(Animal)<\/code>，运行时仍可分派到这个重写版本；但是不会把参数签名改选为 <code>show(Dog)<\/code>。<\/p><p>重载允许同名方法接收不同参数个数、不同参数类型或不同顺序；仅返回类型不同不够。<code>int f(int x)<\/code> 与 <code>double f(int x)<\/code> 无法只靠调用 <code>f(3)<\/code> 来区分，所以不能这样定义一对重载。<\/p>"}, {"title": "4. 字段遮蔽与 static：不要把方法规则套到所有东西", "html": "<pre><code>class Parent {\n    public int n = 1;\n    public String name() { return \"P\"; }\n}\nclass Child extends Parent {\n    public int n = 2;\n    @Override\n    public String name() { return \"C\"; }\n}\nParent p = new Child();\nSystem.out.println(p.n);      // 1\nSystem.out.println(p.name()); // C<\/code><\/pre><p>字段访问不是实例方法调用。<code>p.n<\/code> 根据 p 的声明类型 Parent 解析，因此读取 Parent 的 n；<code>p.name()<\/code> 才按实际 Child 对象分派。一个 Child 对象中可以存在父类和子类各自声明的同名字段，这很容易让维护者混淆，所以设计中应避免。<\/p><p>同一类内，局部变量也可能遮蔽字段：<code>int n = 20;<\/code> 之后写 <code>n<\/code> 指局部变量，写 <code>this.n<\/code> 指当前对象字段。构造器里 <code>this.radius = radius;<\/code> 就是在区分同名字段与参数。<\/p><p><code>static<\/code> 方法属于类，不进行上述对象实例方法的动态重写；子类同名 static 方法是隐藏。调用时优先写 <code>ClassName.method()<\/code>，避免让读者误以为按对象分派。<code>private<\/code> 方法也不是供子类重写的可继承接口。<\/p>"}, {"title": "5. 转型：改变看对象的方式，不改变对象本身", "html": "<p><code>Animal a = new Dog();<\/code> 是向上转型：Dog 是 Animal 的子类型，所以安全。若要调用 Dog 独有行为，你可在检查后向下转型：<\/p><pre><code>if (a instanceof Dog) {\n    Dog d = (Dog) a;\n    d.fetch();\n}<\/code><\/pre><p><code>(Dog) a<\/code> 不会重新创建 Dog，也不会把 Cat 变成 Dog；它请求运行时验证“这个引用当前指向的对象确实能当作 Dog 使用”。若 <code>Animal a = new Cat();<\/code>，随后强转 Dog，就会抛出 <code>ClassCastException<\/code>。能写过编译不代表运行时对象一定匹配。<\/p><p>数值转型是另一类情况：<code>double d = 7;<\/code> 可自动扩大；<code>int n = (int) 7.9;<\/code> 显式丢弃小数部分，结果 7，朝零截断。它不是四舍五入。不要把数值转换与对象引用转换混成“类型前面加括号就都能转”。<\/p><p>设计提示：若每次使用 Animal 都要先判断 Dog/Cat 再强转，你可能把应该共同声明的行为漏放进父类或接口了。类型检查偶尔必要，但多态的目的之一正是减少这样的分支。<\/p>"}, {"title": "6. final：限制重新赋值，不自动冻结对象", "html": "<p>final 有三个常见位置：<code>final class<\/code> 不允许创建子类；<code>final<\/code> 实例方法不允许子类重写；<code>final<\/code> 变量一旦完成初始化就不能重新赋值。它们限制的对象不同，不能只记成“不能改”。<\/p><pre><code>final int[] values = {1, 2};\nvalues[0] = 9;             // 合法：修改数组内容\n// values = new int[]{3};  // 非法：给 final 变量重新赋值<\/code><\/pre><p>values 是一张不可换地址的“引用便签”，数组仍然可修改。<code>final List&lt;String&gt; names<\/code> 也不保证不能 add。相反，String 本身是不可变类型，是类型设计保证对象内容不能就地改变，不是因为某个引用变量写了 final。<\/p><p>因此，<strong>final 引用不等于不可变对象，也不等于自动线程安全<\/strong>。课件提到 final 的安全性和优化好处时，应把它理解为限制变化的一种工具，而不是适用于所有场景的性能或并发保证。<\/p><p>final 字段也可以在构造器中初始化，不要求声明处一定写值；关键是每条正常完成构造的路径都需要按规则完成初始化。入门练习中优先看它究竟修饰类、方法还是变量。<\/p>"}, {"title": "7. 泛型：把类型也当成参数", "html": "<p>方法参数让同一段逻辑处理不同数值；泛型类型参数让同一份容器代码处理不同类型。<code>Box&lt;String&gt;<\/code> 与 <code>Box&lt;Integer&gt;<\/code> 使用同一套 Box 定义，同时由编译器检查放入和取出的类型。<\/p><pre><code>class Box&lt;T&gt; {\n    private T value;\n    void set(T value) { this.value = value; }\n    T get() { return value; }\n}\nBox&lt;String&gt; box = new Box&lt;&gt;();\nbox.set(\"hello\");\nString s = box.get();\n// box.set(3); // 编译错误<\/code><\/pre><p>T 是类型参数的名字，不是一个叫 T 的具体业务类。创建 <code>Box&lt;String&gt;<\/code> 后，可以把这个使用场景理解为“value 的类型被要求为 String”。因此无需从 Object 取出后再手工强转，也能更早发现把数字放进字符串容器的错误。<\/p><p>泛型参数使用引用类型，所以写 <code>ArrayList&lt;Integer&gt;<\/code>，不能写 <code>ArrayList&lt;int&gt;<\/code>。自动装箱可把 int 转成 Integer 包装对象。另一个常见坑：即使 Dog 是 Animal 的子类，<code>ArrayList&lt;Dog&gt;<\/code> 也不能直接赋给 <code>ArrayList&lt;Animal&gt;<\/code>，否则后者可能塞入 Cat，破坏前者的类型保证。这里先理解原因，不必提前学习通配符语法。<\/p>"}, {"title": "8. 读输出题固定四步法", "html": "<ol><li><strong>先检查编译。<\/strong> 变量声明类型提供被调用成员吗？可见性、参数和赋值是否匹配？不通过就停止，不要继续猜输出。<\/li><li><strong>若有重载，先定签名。<\/strong> 看实参表达式在编译时的类型，确定选择哪个参数版本。<\/li><li><strong>若是可重写实例方法，再找实现。<\/strong> 看接收者实际对象属于哪个类，沿继承链找该签名最近的重写版本。<\/li><li><strong>若是字段或 static，回到静态规则。<\/strong> 不要按对象类型套动态分派。若有强转，再单独检查运行时类型是否匹配。<\/li><\/ol><p>例如 <code>Parent p = new Child(); p.m(x);<\/code> 有两种角色：p 是接收者，x 是参数。参数类型先影响重载；接收者的实际类型再影响重写。把两个角色分开写在草稿上，往往比背更多例题有效。<\/p><p>最后核对题目问的是“编译错误”“运行时异常”还是“实际输出”。这些不是同一类答案：编译器不让运行，和运行到某行才失败，发生的阶段不同。在纸上先标记阶段，会大幅减少混乱。<\/p>"}], "quiz": [{"id": "poly-1", "kind": "mcq", "prompt": "输出是什么？", "options": ["1 和 P", "2 和 C", "1 和 C", "2 和 P"], "answer": 2, "explanation": "p.n 是字段，按声明类型 Parent 解析为 1；p.name() 是被重写的实例方法，按实际 Child 对象运行，得到 C。", "hint": "把字段与实例方法分成两种规则。", "tags": ["多态", "遮蔽"], "code": "class Parent { public int n=1; public String name(){return \"P\";} }\nclass Child extends Parent { public int n=2; public String name(){return \"C\";} }\nParent p=new Child();\nSystem.out.println(p.n);\nSystem.out.println(p.name());"}, {"id": "poly-2", "kind": "mcq", "prompt": "这次调用选择哪一个参数版本？", "options": ["show(Dog)，因为对象是 Dog", "show(Animal)，因为 pet 声明为 Animal", "随机选择", "两个都调用"], "answer": 1, "explanation": "重载在编译时选择。pet 表达式的类型是 Animal，所以选择 show(Animal)；不会因为它指向 Dog 而运行时改选重载。", "hint": "重载先看参数表达式的静态类型。", "tags": ["重载"], "code": "void show(Animal x) { }\nvoid show(Dog x) { }\nAnimal pet = new Dog();\nshow(pet);"}, {"id": "poly-3", "kind": "mcq", "prompt": "哪种修改能构成合法重载？", "options": ["同名同参数，只把返回类型从 int 改成 double", "同名，把参数类型从 int 改成 double", "只修改参数名称 x 为 y", "只添加 @Override"], "answer": 1, "explanation": "签名区分方法名和参数列表；参数类型不同可以重载。仅返回类型、参数名或注解不同不能区分调用。", "hint": "调用 f(3) 时，编译器能否区分两个候选？", "tags": ["重载", "签名"]}, {"id": "poly-4", "kind": "mcq", "prompt": "哪行会因为 final 而编译失败？", "options": ["a[0] = 7;", "System.out.println(a[0]);", "a = new int[]{8};", "以上三行都失败"], "answer": 2, "explanation": "final 限制变量 a 不能重新赋值，不禁止修改它所指向数组的元素。", "hint": "锁住的是引用便签，还是数组格子？", "tags": ["final", "引用"], "code": "final int[] a = {1, 2};"}, {"id": "poly-5", "kind": "mcq", "prompt": "Animal a = new Cat(); 随后执行 Dog d = (Dog) a;，假定 Cat、Dog 都是 Animal 的不同子类，会怎样？", "options": ["把 Cat 改造成 Dog", "复制一个新的 Dog", "运行时发生 ClassCastException", "只要写了括号就一定成功"], "answer": 2, "explanation": "向下转型不会改变实际对象。对象是 Cat，不能当 Dog 使用，因此类型检查在运行时失败。", "hint": "强转是验证身份，不是变身。", "tags": ["转型", "运行时异常"]}, {"id": "poly-6", "kind": "mcq", "prompt": "哪个泛型容器声明合法且适合保存整数？", "options": ["ArrayList<int> xs = new ArrayList<>();", "ArrayList<Integer> xs = new ArrayList<>();", "ArrayList<integer> xs = new ArrayList<>();", "ArrayList<> xs = new ArrayList<Integer>();"], "answer": 1, "explanation": "Java 泛型的类型实参必须是引用类型，Integer 是 int 的包装类型。int 是基本类型，integer 不是正确类型名，左侧也不能只写空菱形。", "hint": "基本类型对应的包装类首字母大写。", "tags": ["泛型", "装箱"]}]}, {"id": "contracts", "title": "抽象类、接口与文档：把承诺写清楚", "subtitle": "一个类型告诉使用者“你可以要求什么”，实现负责“怎样完成”。", "minutes": 50, "source": [{"file": "W03_101_102.pdf", "pages": "40、44–49"}, {"file": "W04_101_102.pdf", "pages": "23–62"}], "objectives": ["判断何时选抽象类、何时选接口，并写正确的 extends/implements。", "把接口变量与具体对象联系起来，理解契约与多态。", "区分对象身份、内容相等与排序比较，了解 Object 的基础方法。", "编写说明行为、边界和返回值的 Javadoc，而非重复方法名。"], "sections": [{"title": "1. 抽象类：允许“还没完成”的公共基类", "html": "<p>如果每种图形都有位置，但每种面积算法不同，你希望父类保存共同位置，却不能提供一种对所有图形都正确的面积公式。这正适合抽象类：它能提供公共状态和已实现方法，同时把某些行为留给子类。<\/p><pre><code>abstract class Shape {\n    private int x;\n    protected Shape(int x) { this.x = x; }\n    public int getX() { return x; }\n    public abstract double area();\n}\nclass Circle extends Shape {\n    private double radius;\n    Circle(int x, double radius) {\n        super(x);\n        this.radius = radius;\n    }\n    @Override\n    public double area() { return Math.PI * radius * radius; }\n}<\/code><\/pre><p><code>abstract double area();<\/code> 用分号结束，没有方法体。它规定子类需要提供面积行为。非抽象子类必须实现所有尚未实现的抽象方法；若还没完成，可以继续声明为 abstract。<\/p><p>不能写 <code>new Shape(0)<\/code>，因为 Shape 被声明为抽象；可以写 <code>Shape s = new Circle(0, 2)<\/code>，因为变量类型可以抽象，实际对象必须具体。抽象类仍能有构造器，创建具体子类时它负责初始化共同状态。<strong>抽象类不必一定包含抽象方法<\/strong>，只要声明 abstract 就不能被直接实例化。<\/p>"}, {"title": "2. 接口：不要求一家人，也能遵守同一份约定", "html": "<p>鸟和飞机并不适合强行继承同一个具体“飞行机器”类，但它们都可能提供飞行行为。接口关注“能做什么”，让本来无关的类也能接受同样调用。<\/p><pre><code>interface Flyable {\n    void fly();\n}\nclass Bird implements Flyable {\n    @Override\n    public void fly() { System.out.println(\"bird\"); }\n}\nclass Airplane implements Flyable {\n    @Override\n    public void fly() { System.out.println(\"plane\"); }\n}\nFlyable f = new Airplane();\nf.fly(); // plane<\/code><\/pre><p>这里接口中的普通抽象方法隐含 public，因此实现类的方法必须写 public，不能缩小访问权限。<code>implements<\/code> 表示兑现接口承诺。接口不能直接 new；你创建的是 Airplane，再用 Flyable 类型的变量持有它。<\/p><p>一个类只能 extends 一个类，但可以 implements 多个接口，例如 <code>class SmartTV implements Playable, Connectable<\/code>。接口之间可以 extends 多个接口；这表示组合行为约定，不是继承多个父类的对象状态。<\/p><p>接口承诺不只是“方法名字存在”。如果 <code>withdraw(amount)<\/code> 文档规定余额不足时拒绝操作，实现就应遵守这个含义。只写一个空方法虽然可能通过某些语法检查，却未必履行行为契约。<\/p>"}, {"title": "3. 抽象类与接口：用选择理由记忆", "html": "<table><thead><tr><th>问题<\/th><th>抽象类<\/th><th>接口<\/th><\/tr><\/thead><tbody><tr><td>主要目的<\/td><td>一组相关类共享状态与部分实现<\/td><td>定义可共同使用的能力与约定<\/td><\/tr><tr><td>普通实例字段<\/td><td>可以有<\/td><td>没有对象自己的普通实例字段；接口字段是常量<\/td><\/tr><tr><td>构造器<\/td><td>可以有<\/td><td>没有供实例初始化的构造器<\/td><\/tr><tr><td>一个类可加入多少<\/td><td>只能直接 extends 一个类<\/td><td>可 implements 多个接口<\/td><\/tr><tr><td>能直接实例化吗<\/td><td>不能<\/td><td>不能<\/td><\/tr><\/tbody><\/table><p>如果 Circle、Rectangle 都需要 x、y 和移动逻辑，抽象 Shape 很自然。如果打印机、文档、图表都需要“可打印”，接口 Printable 更自然。两者可以配合：抽象基类实现一部分接口，具体子类补全剩余部分。<\/p><p>课件提醒过版本变化，因此不要把“接口永远不能有实现”当成现代 Java 规则。接口可以有 default 方法、static 方法，也允许用于复用内部逻辑的 private 方法。入门时先掌握普通抽象方法这个核心形态；看到有方法体时再区分它的修饰符。<\/p><p>另一个常见误解是“接口比抽象类更高级，所以总选接口”。正确问题是你是否要共享对象状态、类族本身是否有共同含义，以及调用者到底需要哪些能力。选择需要理由，而不是等级排名。<\/p>"}, {"title": "4. 面向接口编程：调用者只知道必要的行为", "html": "<pre><code>interface Sortable {\n    int size();\n    int compare(int i, int j);\n    void swap(int i, int j);\n}\nvoid sort(Sortable data) {\n    // 排序过程只使用 size、compare、swap\n}<\/code><\/pre><p>这对应课件的 Sortable 例子：数值集合和人员集合内部储存不同，但只要提供比较和交换，排序过程就可以共用。<code>sort<\/code> 的参数使用 Sortable，表达“我只需要这些能力”，而不是要求某个特定内部结构。<\/p><p>compare 的返回约定必须写清楚。例如负数表示第 i 项应排前面，0 表示在本排序标准下相同，正数表示排后面。若一个实现把负数当成“大于”，同样签名也会让算法出错。因此接口的语法和文档缺一不可。<\/p><p>课件提到 <code>Comparable<\/code> 作为无关类可共同实现的接口。帮助理解的补充例子是 <code>Comparable&lt;Person&gt;<\/code> 的 <code>compareTo(Person other)<\/code>：返回负、零、正来定义当前对象与 other 的顺序。它不要求刚好返回 -1、0、1；判断应写 <code>result &lt; 0<\/code>，不能写 <code>result == -1<\/code>。<\/p><p>请把“通过接口统一使用”与“所有对象实现完全相同”分开。统一的是可要求的行为和约定；不同类如何完成，仍由各自实现决定。<\/p>"}, {"title": "5. Object、toString 与 equals：身份和内容要分清", "html": "<p>Object 位于普通类继承树顶端。课件列出的 <code>toString()<\/code>、<code>equals()<\/code>、<code>hashCode()<\/code> 等方法因此可以被你的对象使用。<code>System.out.println(obj)<\/code> 常通过字符串转换得到对象的文字表示，重写 toString 能让调试更容易读。<\/p><pre><code>class Person {\n    private String name;\n    Person(String name) { this.name = name; }\n    @Override\n    public String toString() { return \"Person(\" + name + \")\"; }\n}\nPerson p = new Person(\"Ada\");\nSystem.out.println(p); // Person(Ada)<\/code><\/pre><p>对引用使用 <code>==<\/code>，比较是否指向同一个对象；<code>equals<\/code> 的含义由类的实现决定。Object 默认 equals 也是身份比较。String 则重写它来比较文本内容，因此字符串内容比较通常写 <code>a.equals(b)<\/code>，而不是依赖 <code>a == b<\/code>。<\/p><p>作为理解 Object 的补充：如果你自定义“相同姓名代表相等”的 equals，一般也要按相同标准重写 hashCode。契约要求 equals 为 true 的两个对象有相同 hashCode；hashCode 相同不反过来证明 equals 为 true。完整相等性设计比本节更深入，这里先掌握身份、内容相等、排序相对大小是三个不同问题。<\/p>"}, {"title": "6. 文档是给调用者看的，不是给自己背代码的", "html": "<p>课件区分内部文档与外部文档。内部文档帮助维护者理解实现，例如为什么这里用缓存、哪个不变量必须成立。API 文档帮助调用者理解如何使用一个类或方法，即使没有阅读源码也应能判断输入、结果和失败情况。<\/p><p>普通 <code>//<\/code> 或 <code>/* ... */<\/code> 是实现注释；<code>/** ... */<\/code> 是文档注释，放在类、方法等声明前，可由 Javadoc 工具生成 API 页面。最重要的不是多写几行英文，而是补充方法名无法表达的行为。<\/p><p>例如 <code>setToolTipText(String text)<\/code> 写“设置提示文本”几乎只是翻译名字。更有用的说明是：“鼠标停留时显示该文本；text 为 null 时关闭此组件的提示。”后半句给了调用者真正需要的边界约定。<\/p><p>测试也是根据这些约定设计的。若文档完全没说余额不足会怎样，开发者和测试者可能各自作出不同假设。把正常输入、边界输入与异常情况写清楚，就是减少这种沟通成本。<\/p>"}, {"title": "7. 写一份真的能用的 Javadoc", "html": "<pre><code>/**\n * Returns the total price for the requested quantity.\n *\n * @param quantity the number of items; must be non-negative\n * @return the total price, including zero for an empty order\n * @throws IllegalArgumentException if quantity is negative\n */\npublic int totalPrice(int quantity) {\n    if (quantity &lt; 0) {\n        throw new IllegalArgumentException(\"negative quantity\");\n    }\n    return quantity * 5;\n}<\/code><\/pre><p>首句概括可观察行为，便于生成摘要；<code>@param<\/code> 描述每个参数的含义与条件；<code>@return<\/code> 描述返回值；<code>@throws<\/code> 说明何时抛什么异常。void 方法没有返回值，不需要为它编造 @return。构造器也没有返回值。<\/p><p>标签区分大小写，并按 Javadoc 格式放在相应行。描述应尽量独立于实现：这里说“返回总价”，不必承诺内部永远用乘法，因为后面即使改用价格表，调用者看到的约定可以保持。<\/p><p>课件给出的英文风格是第三人称动词，例如 <code>Returns<\/code>、<code>Gets<\/code>；重点仍是清楚。命令行 <code>javadoc *.java<\/code> 可以生成文档；它不会自动验证你的实现真的满足描述，也不会因为文档写了“非负”就替代码检查输入。<\/p>"}, {"title": "8. 一起想：从契约到实现再到测试", "html": "<p>考虑 <code>interface Withdrawable { boolean withdraw(int amount); }<\/code>。单看签名，你知道方法接收整数、返回布尔值，却不知道负数、零和余额不足时怎么办。为了可复用与可测试，需要补全约定，例如“正金额且余额足够则扣款并返回 true；余额不足不改变余额并返回 false；非正金额抛 IllegalArgumentException”。<\/p><p>实现类 BankAccount 再根据这个约定管理 private 余额；调用者不必知道余额用 int 存储，还是通过外部服务查询。测试则分别覆盖成功、余额恰好相等、余额不足、零和负数。接口、封装、文档、测试就连成了一条线。<\/p><p>请试着不用代码说出三个层次：接口定义可以发出什么请求；文档定义请求意味着什么；实现完成请求。最后让测试给出可重复的证据。只有方法名字一致，但语义随意变化的两个实现，无法可靠地被同一个调用者使用。<\/p><p>你学习设计模式时也会反复遇到这个思路：把会变化的做法藏在实现里，让调用者依赖稳定的行为约定。现在把接口和抽象类读懂，比提前背模式名称更有帮助。<\/p>"}], "quiz": [{"id": "con-1", "kind": "mcq", "prompt": "哪行合法？假定 Circle 是实现了所有抽象方法的具体 Shape 子类。（本题独立设定：Circle 提供可用的无参构造器。）", "options": ["Shape s = new Shape();", "Shape s = new Circle();", "Circle c = new Shape();", "abstract Shape s = new Circle();"], "answer": 1, "explanation": "抽象类不能直接实例化，但能作为引用变量的声明类型。实际创建的是具体 Circle 对象。", "hint": "变量类型可以抽象，对象必须具体。", "tags": ["抽象类", "多态"]}, {"id": "con-2", "kind": "mcq", "prompt": "接口声明 void fly();，实现类的方法为何通常必须写 public？", "options": ["因为方法名叫 fly", "因为接口的这个普通抽象方法隐含 public，实现不能降低访问权限", "因为每个 Java 方法都必须 public", "只有写 public 才能有方法体"], "answer": 1, "explanation": "接口向使用者提供公开行为承诺；实现不能把承诺的方法藏成包内或 private。", "hint": "比较接口承诺的可见性与实现的可见性。", "tags": ["接口", "访问权限"]}, {"id": "con-3", "kind": "mcq", "prompt": "以下哪句话正确？", "options": ["抽象类一定至少有一个抽象方法", "接口在现代 Java 中永远不能出现有方法体的方法", "一个类可以实现多个接口", "接口可以通过构造器直接 new"], "answer": 2, "explanation": "Java 类可以 implements 多个接口。抽象类不必含抽象方法；接口可有 default/static/private 实现方法；接口不能直接实例化。", "hint": "区分最常用教学写法与语言允许的全部形式。", "tags": ["接口", "抽象类"]}, {"id": "con-4", "kind": "mcq", "prompt": "某个 compareTo 返回 -12，应该如何判断“排在前面”？", "options": ["result == -1", "result < 0", "result == 1", "必须先把结果转成 boolean"], "answer": 1, "explanation": "比较约定关注符号：负数、零、正数，并不保证只返回 -1、0、1。", "hint": "“负数”比“负一”更宽。", "tags": ["Comparable", "契约"]}, {"id": "con-5", "kind": "mcq", "prompt": "哪份文档最有用？方法为 setToolTipText(String text)。", "options": ["This method sets tool tip text.", "Sets text.", "Registers the text shown while the cursor lingers; null disables this tooltip.", "Calls an internal setter on line 12."], "answer": 2, "explanation": "它补充方法名无法告诉调用者的触发条件和 null 行为，同时避免把内部实现当成永久承诺。", "hint": "调用者最需要知道什么边界行为？", "tags": ["Javadoc", "文档"]}, {"id": "con-6", "kind": "mcq", "prompt": "对于没有重写 equals 的自定义类，下列两个 new Person(\"Ada\") 对象默认相等吗？", "options": ["一定相等，因为名字一样", "默认 equals 比较身份，两个分别新建的对象不相等", "只要 toString 相同就相等", "只有 hashCode 相同就必定相等"], "answer": 1, "explanation": "Object 默认 equals 使用对象身份。业务内容相等需要类自己定义；toString 和 hashCode 相同都不能单独证明 equals 为 true。", "hint": "Person 是否自己定义过内容比较规则？", "tags": ["Object", "equals"]}]}, {"id": "testing", "title": "测试与异常：用证据确认程序行为", "subtitle": "从“它跑起来了”走到“我知道它在什么输入下应当怎样”。", "minutes": 45, "source": [{"file": "W04_101_102.pdf", "pages": "63–76"}], "objectives": ["区分 verification/validation 和不同测试层次。", "按 Arrange–Act–Assert 写与阅读 JUnit 测试。", "根据行为类别挑选正常、边界和异常测试，而不是只换几个数字。", "解释 assertThrows 中 lambda 何时执行，并区分编译错误、异常与错误输出。"], "sections": [{"title": "1. 能运行，不等于满足要求", "html": "<p>一个计算器程序成功启动，只说明某些路径没有立即崩溃。它仍可能把减法写成加法、把余额扣两次、在边界输入时出错。课件希望你从“程序能运行，所以正确”转向“我期待什么行为，怎样给出证据”。<\/p><p><strong>Verification<\/strong> 问“实现是否符合规定”，可理解为有没有把系统做对；<strong>validation<\/strong> 问“做出的东西是否满足真正需求”，可理解为有没有做对用户需要的系统。例如规格写按含税价计算，你的实现完全照做，但用户真正要的是税前价，那么实现可能符合规格，却仍未满足实际需要。<\/p><p>测试运行程序并比较实际结果和期望结果，是发现问题的办法；代码审查则通过阅读代码寻找问题。它们互相补充。测试通过不等于从数学上证明所有可能输入都正确；测试失败则提供一个具体反例，帮助定位问题。<\/p><p>复习时也要把测试当成思考工具：先不用电脑，写下输入、预期结果与理由，再执行。若执行后才随便决定“这个输出也可以”，测试就失去了核对标准。<\/p>"}, {"title": "2. 四种测试层次：你到底在测多大一块？", "html": "<table><thead><tr><th>层次<\/th><th>主要对象<\/th><th>选课系统例子<\/th><\/tr><\/thead><tbody><tr><td>Unit，单元<\/td><td>小而独立的方法或类<\/td><td>课程剩余名额计算<\/td><\/tr><tr><td>Integration，集成<\/td><td>组件之间的接口与协作<\/td><td>选课服务是否正确调用课程和学生组件<\/td><\/tr><tr><td>System，系统<\/td><td>完整系统的功能与非功能要求<\/td><td>从登录到选课结果的完整流程<\/td><\/tr><tr><td>Acceptance，验收<\/td><td>是否满足约定需求、可供使用<\/td><td>用户验证选课规则与实际使用场景<\/td><\/tr><\/tbody><\/table><p>“我打开整个绘图程序试了一下”不是同一件事于“我自动验证 Circle.area()”。它们检查的范围和定位能力不同。小单元测试失败时，通常更容易缩小原因；系统流程测试则能发现单独组件看不出的组合问题。<\/p><p>单元并不机械等于一行代码；它通常是一段可独立核对的行为。也不要把“JUnit 写的”自动等同“单元测试”——框架是工具，测试真正覆盖了多大的系统才决定它的性质。<\/p>"}, {"title": "3. JUnit 测试：准备、执行、断言", "html": "<pre><code>import org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\nclass CalculatorTest {\n    @Test\n    void addsTwoPositiveNumbers() {\n        Calculator calculator = new Calculator(); // Arrange\n        int result = calculator.add(2, 3);          // Act\n        assertEquals(5, result);                    // Assert\n    }\n}<\/code><\/pre><p><code>@Test<\/code> 告诉 JUnit 这是测试方法，框架会按它的规则找到并运行。Arrange 准备对象与输入；Act 调用被测行为；Assert 判断结果。这里期望值 5 来自题意中加法的定义，不是从当前程序输出里反抄。<\/p><p><code>assertEquals(expected, actual)<\/code> 的参数顺序要固定记住：期望在前，实际在后。断言失败时，框架会报告差异。测试方法通常无需写 main，因为执行入口由测试框架提供。<\/p><p>JUnit 是测试框架，不是 Java 语法本身；在真实项目中需要配置相应依赖。你的 W04 使用 JUnit Jupiter/JUnit 5 风格的 import 和 @Test。这里的阅读与实验用于学习行为，不表示浏览器已经装入或运行了真正的 Java/JUnit 环境。<\/p>"}, {"title": "4. 选择断言：问对问题比写更多测试重要", "html": "<p>每个断言都在表达一个具体问题：<code>assertTrue(condition)<\/code> 要求条件为真；<code>assertFalse(condition)<\/code> 要求为假；<code>assertEquals(expected, actual)<\/code> 要求值相等；<code>assertNull(value)<\/code> 要求没有对象引用；<code>assertNotNull(value)<\/code> 要求存在对象。<code>assertNotEquals<\/code> 检查不相等。<\/p><pre><code>@Test\nvoid withdrawingTooMuchPreservesBalance() {\n    BankAccount account = new BankAccount(100);\n    boolean success = account.withdraw(120);\n    assertFalse(success);\n    assertEquals(100, account.getBalance());\n}<\/code><\/pre><p>假设契约规定余额不足应返回 false 且不改余额，那么两项都需要检查。如果只检查 false，一个先扣钱再返回 false 的错误实现也可能通过。同样，一个返回值正确但错误修改了别的状态的方法，不能只靠返回值测试发现。<\/p><p>测试不必照抄实现的每个 if 分支，但必须覆盖行为承诺。让测试名字说明场景与结果，例如 <code>withdrawingTooMuchPreservesBalance<\/code>，比 <code>test1<\/code> 更容易理解失败含义。<\/p>"}, {"title": "5. 输入分类：正常、边界、特殊与无效", "html": "<p>假设 <code>isPassing(score)<\/code> 在 score ≥ 50 时返回 true。只测试 80、90、100，三个测试可能都走同一种行为，覆盖并不比一个高分测试强很多。更有效的是 49、50、51：它们分别在边界下方、正好边界、边界上方，能区分 <code>&gt;<\/code> 与 <code>&gt;=<\/code> 的错误。<\/p><p>对数组求和，考虑空数组、一个元素、多个元素、负数与混合符号；若契约接收 null，还要定义并测试 null。不要自行假设“空数组肯定不可能出现”。对绝对值，普通入门例子测试正、负、零；更严谨时还要留意整数最小值取负会溢出，这说明边界应结合数据类型范围理解。<\/p><p>无效输入的结果取决于契约。负数量可能规定抛异常，也可能按零处理；测试者不能擅自选择喜欢的结果。如果题目给了规格，就按规格建立期望；规格含糊，则先明确要求。<\/p><p>一条实用原则：每加一个测试，都能说出“它试图区分哪种正确与错误的实现”。如果两个测试只换数字却没有新增行为类别，下一条边界测试可能更值得写。<\/p>"}, {"title": "6. 异常：失败也是可以规定和测试的行为", "html": "<p>Java 的错误不只有一种。拼错方法名、类型不匹配属于编译问题，程序可能根本无法开始；数组越界、空引用调用等可能在运行到某一步时抛异常；把加法错写成减法则可能正常运行却给出错误结果。测试时先分清是哪一种失败。<\/p><p>整数除法中 <code>10 / 0<\/code> 会抛 <code>ArithmeticException<\/code>。注意这里明确是整数：double 浮点数除以零有不同规则，不能把整数结论无限套用。异常若没有被合适处理，会中断当前正常执行路径并向调用方传播。<\/p><pre><code>public int divide(int x, int y) {\n    return x / y;\n}\n@Test\nvoid divideByZeroThrows() {\n    Calculator calculator = new Calculator();\n    assertThrows(ArithmeticException.class,\n                 () -&gt; calculator.divide(10, 0));\n}<\/code><\/pre><p>这里测试期待异常，因此抛出相应异常是测试成功的证据，不是“测试框架坏了”。测试成功与被测方法“正常返回”不是同一件事；期望什么，取决于规格。<\/p>"}, {"title": "7. 为什么 assertThrows 要接收 lambda？", "html": "<p>对 <code>assertThrows(ArithmeticException.class, () -&gt; calculator.divide(10, 0))<\/code>，第一项描述期望的异常类型，第二项提供一段<strong>稍后由 JUnit 调用<\/strong>的动作。<code>() -&gt; ...<\/code> 这里可以先读成“无参数的待执行任务”。<\/p><p>若先在 assertThrows 外部执行 <code>int result = calculator.divide(10, 0);<\/code>，异常在调用 assertThrows 之前就已经发生了。JUnit 的 assertThrows 没有机会围住这段动作、核对异常类型。所以传入的是待执行代码，而不是已经执行完的返回值。<\/p><p>这和 GUI 事件处理有共同思路：注册一个 handler 时不是立刻执行所有按钮操作，而是把行为交给框架，在对应事件发生时调用。后续学习 lambda、事件驱动时，可回到这个“现在交出动作，稍后执行动作”的直觉。<\/p><p>assertThrows 在没有异常或抛出不匹配的异常时会失败；若抛出指定类型或其子类型的异常则通过。入门题先看待执行动作实际运行到哪里，再判断异常是否符合预期。<\/p>"}, {"title": "8. 找 bug 的练法：先预测，再选能揭穿它的输入", "html": "<pre><code>// 需求：当分数不低于 50 时返回 true。\nboolean isPassing(int score) {\n    return score &gt; 50; // 错把 &gt;= 写成 &gt;\n}<\/code><\/pre><p>不要只说“这里错了”就结束。给出能揭穿它的具体测试：输入 50，期望 true，实际 false。输入 80 无法区分正确实现 <code>&gt;= 50<\/code> 与错误实现 <code>&gt; 50<\/code>；输入 50 可以。这个测试的价值来自对行为差异的判断。<\/p><p>再看一个错误：<code>sum = numbers[0];<\/code> 然后从下标 1 开始循环。对非空数组可能得到正确和，但空数组会越界。若契约规定空数组和为 0，空数组测试正好揭示缺陷。你可以根据代码找风险，再根据规格判断正确结果。<\/p><p>推荐复习循环：先读规格并手算答案 → 选一类输入 → 预测错误实现会不会被它抓住 → 执行并比较 → 解释差异。遇到失败后先确定是期望写错还是实现写错，而不是为了让测试变绿就随便改 expected。<\/p><p>完成这章后，用课程里的 Lab04 JUnit 测试和 A1 测试重新练一遍：每个断言究竟保证什么，漏了什么边界，两个测试是否真的覆盖不同情况。这比只记 assertEquals 的名字更接近 CSC207 的软件设计目标。<\/p>"}], "quiz": [{"id": "test-1", "kind": "mcq", "prompt": "assertEquals 的两个主要参数顺序应该是什么？", "options": ["实际值、期望值", "期望值、实际值", "输入值、方法名", "参数名、返回类型"], "answer": 1, "explanation": "JUnit 约定 assertEquals(expected, actual)。保持顺序能让失败报告的期望与实际含义清楚。", "hint": "先说“我期待”，再说“它实际给出”。", "tags": ["JUnit", "断言"]}, {"id": "test-2", "kind": "mcq", "prompt": "需求是 score >= 50，错误实现写成 score > 50。以下哪个输入最直接揭穿这个错误？", "options": ["80", "100", "50", "10"], "answer": 2, "explanation": "正好边界 50：正确实现返回 true，错误实现返回 false。其他给定输入下两种实现结果相同。", "hint": "找两种实现结果刚好不同的位置。", "tags": ["边界测试"]}, {"id": "test-3", "kind": "mcq", "prompt": "测试余额不足的取款操作，契约规定返回 false 且余额不变。最完整的检查是哪一项？", "options": ["只检查程序没有崩溃", "只检查返回 false", "只打印余额，由自己看", "检查返回 false，并断言余额保持原值"], "answer": 3, "explanation": "返回值与状态变化都是契约的一部分。只检查返回 false 会漏掉错误扣款后仍返回 false 的实现。", "hint": "一个方法既能返回结果，也能修改状态。", "tags": ["测试设计", "状态"]}, {"id": "test-4", "kind": "mcq", "prompt": "为什么第二个参数使用 () -> calculator.divide(10, 0)？", "options": ["为了先算出除法结果再传进去", "为了把待执行动作交给 JUnit，由它运行并检查异常", "因为所有 Java 方法都必须用 lambda 调用", "这样会阻止除零异常发生"], "answer": 1, "explanation": "lambda 延迟动作的执行，让 assertThrows 能够包围并观察这次执行。它不阻止异常，而是验证异常。", "hint": "JUnit 必须先接到动作，才有机会观察它抛什么。", "tags": ["异常", "lambda"], "code": "assertThrows(ArithmeticException.class,\n    () -> calculator.divide(10, 0));"}, {"id": "test-5", "kind": "mcq", "prompt": "“两个组件各自正确，但连接时传错参数”，主要适合哪一层测试发现？", "options": ["集成测试", "只检查语法", "只测试每个类中的私有变量名", "只运行 Javadoc"], "answer": 0, "explanation": "集成测试关注组件之间的接口和协作，能发现单独组件测试可能遗漏的连接问题。", "hint": "问题出在组件内部，还是组件之间？", "tags": ["测试层次"]}, {"id": "test-6", "kind": "mcq", "prompt": "所有当前测试都通过，最合理的结论是什么？", "options": ["已经证明程序对所有输入正确", "当前测试覆盖的预期行为都得到了满足，但仍可能遗漏场景", "以后不能再修改测试", "程序不可能有异常"], "answer": 1, "explanation": "通过测试是有限证据。遗漏的输入类别、错误的期望或未检查的状态仍可能隐藏缺陷。", "hint": "测试运行的是有限个案例。", "tags": ["测试设计"]}]}, {"id": "gui", "title": "JavaFX：让界面真正响应你", "subtitle": "从窗口、布局树到按钮、事件和定时器，一步一步连接起来。", "minutes": 55, "source": [{"file": "W05.pdf", "pages": "3–39"}, {"file": "W05_annotated.pdf", "pages": "3–40"}, {"file": "W06-GUI-with annotations.pdf", "pages": "2–28"}, {"file": "W06_JavaFX_timer.pdf", "pages": "2–4"}, {"file": "W05-worksheet.pdf", "pages": "1"}], "objectives": ["画出 Stage → Scene → 根节点 → 子节点的层次。", "把布局草图翻译成 HBox/VBox 的嵌套关系。", "分清注册 handler 与执行 handler，读懂匿名类、lambda 和方法引用。", "预测一次点击、一次输入或一次计时事件会改变什么。"], "sections": [{"title": "1. GUI 程序和从头跑到底的程序有什么不同", "html": "<p>之前的控制台程序通常是：进入 main，按顺序运行，打印结果，结束。图形界面 GUI（Graphical User Interface）需要一直等着人操作：有人输入名字，有人点按钮，也有人关窗口。你写的代码不需要不停地问“有没有点击”，框架会接收事件，在合适的时候调用你登记的方法。这个思路叫事件驱动编程。<\/p><p>JavaFX 是用于 Java 图形界面的工具包。Label 显示文字，TextField 接收文字，Button 让人触发动作；这些都是对象。界面不是一张画好后不变的图片，而是一棵对象组成的树。比如改变某个 Label 对象的 text 属性，框架就把屏幕上的文字更新。<\/p><p>这里要同时区分两条顺序：启动阶段创建组件、摆放组件、登记响应；交互阶段用户产生事件，框架再调用响应。代码出现在 start 里，不代表里面所有逻辑都在启动时立即执行。handler 的方法体通常要等事件发生。复习时，先在每行旁边写“现在做”或“以后事件来时做”，很多混乱就会消失。<\/p>"}, {"title": "2. Stage、Scene、Node：先把三层关系摆对", "html": "<p>Stage 是窗口，可以理解成装内容的外框；Scene 是窗口当前展示的一整页内容；Node 是场景中的节点，可以是按钮、文字，也可以是装其他节点的布局容器。Scene 有一个根节点 root，根节点下面再长出子节点。所谓“一个根节点”不等于“一页只能放一个按钮”：根节点可以是 VBox，VBox 里面可以放很多按钮。<\/p><pre><code>public class GreetingApp extends Application {\n    @Override\n    public void start(Stage stage) {\n        Label message = new Label(&quot;Ready&quot;);\n        VBox root = new VBox(12, message);\n        Scene scene = new Scene(root, 360, 180);\n        stage.setScene(scene);\n        stage.setTitle(&quot;Greeting&quot;);\n        stage.show();\n    }\n\n    public static void main(String[] args) {\n        launch(args);\n    }\n}<\/code><\/pre><p>这段是结构示例，使用前需要相应的 javafx.application.Application、javafx.stage.Stage、javafx.scene.Scene、javafx.scene.control.Label 和 javafx.scene.layout.VBox 导入，以及已配置好的 JavaFX 环境。extends Application 表示这是 JavaFX 应用；框架启动后调用你 override 的 start。new Label 创建节点；new VBox(12, message) 创建容器，12 是子节点间距；Scene 指定内容和大小；setScene 把页面放入窗口；show 才让窗口出现。<\/p><p>不要死记“启动一定只靠自己在 main 里调用 start”。start 的 Stage 参数是框架传进来的，生命周期由 JavaFX 管理。复习的目标是说清对象之间谁包含谁，以及哪一行建立这层关系。<\/p>"}, {"title": "3. 布局不是坐标猜谜，而是容器的规则", "html": "<p>HBox 把直接子节点从左到右排；VBox 把直接子节点从上到下排。GridPane 按行列格子放；BorderPane 有 top、bottom、left、right、center 五个区域；StackPane 把子节点叠放，适合覆盖层。布局容器本身也是 Node，因此可以把一个 VBox 放进 HBox，形成嵌套。<\/p><pre><code>Label title = new Label(&quot;Choose a topic&quot;);\nButton java = new Button(&quot;Java&quot;);\nButton git = new Button(&quot;Git&quot;);\nVBox choices = new VBox(8, java, git);\nTextField answer = new TextField();\nHBox middle = new HBox(16, choices, answer);\nVBox root = new VBox(12, title, middle);<\/code><\/pre><p>先只看 root 的直接孩子：title 和 middle，所以顶层是上下两块。再看 middle：choices 在左，answer 在右。最后看 choices：Java 按钮在上，Git 按钮在下。容器的排列规则只负责自己的直接孩子，不会把所有后代摊平成一排。想象给每个容器画一个框，先排大框，再排框内小块。<\/p><p>反过来看图写代码时也用这个方法：第一层是横排还是竖排？哪些节点应该成为同一容器的直接孩子？不要只看代码里创建对象的先后。创建 java 按钮在前，不代表它一定出现在窗口最上面；最终位置由你把它加入哪个容器、加入顺序和布局规则共同决定。<\/p><p>对照 W05 worksheet 的原始结构再做一次：最外层 VBox 的孩子是一个 Label 和一个 HBox；HBox 的孩子是一个 VBox 和一个 TextField；内层 VBox 再包含三个 Button。先只写出树，再从叶子向外组装，或从根向下逐层加入，最终包含关系应相同。<\/p><pre><code>Label label = new Label(&quot;This is the top node&quot;);\nButton b1 = new Button(&quot;Button 1&quot;);\nButton b2 = new Button(&quot;Button 2&quot;);\nButton b3 = new Button(&quot;Button 3&quot;);\nVBox buttons = new VBox(8, b1, b2, b3);\nTextField input = new TextField();\nHBox lowerRow = new HBox(16, buttons, input);\nVBox root = new VBox(12, label, lowerRow);<\/code><\/pre><p>逐步检查：buttons 收纳三个按钮，所以按钮上下排列；lowerRow 把 buttons 与 input 并排，所以按钮列左边、输入框右边；root 最后把 label 放在 lowerRow 上方。改变最外层 VBox 为 HBox，会改变标签与整块下方区域的关系；改变内层 VBox 为 HBox，则只把三个按钮改为横排。这是演示里可以反复切换并预测的局部影响。<\/p>"}, {"title": "4. 一次点击到底经过什么：source → event → handler", "html": "<p>事件源 source 是发生动作的节点；event 是描述动作的数据对象；handler 是收到事件后执行代码的对象。比如按钮被激活可以产生 ActionEvent，鼠标按下、拖动等是 MouseEvent，键盘输入相关的是 KeyEvent。按钮的 ActionEvent 表达“触发这个按钮动作”，不只局限于鼠标点击，键盘激活也可以触发。<\/p><pre><code>TextField name = new TextField();\nLabel output = new Label(&quot;Waiting&quot;);\nButton greet = new Button(&quot;Greet&quot;);\n\ngreet.setOnAction(event -&gt; {\n    String text = name.getText();\n    output.setText(&quot;Hello, &quot; + text);\n    name.setText(&quot;&quot;);\n});<\/code><\/pre><p>执行 setOnAction 时是在登记响应，并不会立刻读名字、改 output 或清空输入。之后你输入 Amy 并点击按钮：框架产生 ActionEvent → 调用 handler → getText 读到 Amy → output 显示 Hello, Amy → name 被清空。再输入 Ben，再点一次，会重新读取这次的 Ben，而不是永远记住第一次的 Amy。<\/p><p>只创建 Button 而不登记 handler，按钮可能有按压视觉效果，却不会自动替你完成业务动作。相反，只声明一个实现 EventHandler 的类但不把对象交给组件，事件也不会神奇地找到它。读题要分别检查“定义了响应”与“挂接了响应”这两件事。<\/p>"}, {"title": "5. EventHandler 是接口：先理解完整写法，再缩短", "html": "<p>EventHandler&lt;ActionEvent&gt; 是接口类型。它约定一个 handle(ActionEvent event) 方法。尖括号里说明这个响应接收的事件类型，不是在创建 ActionEvent。实现类的实例是普通对象，可以存在变量里，也可以让两个组件共用。<\/p><pre><code>class GreetingHandler implements EventHandler&lt;ActionEvent&gt; {\n    private final TextField input;\n    private final Label output;\n\n    GreetingHandler(TextField input, Label output) {\n        this.input = input;\n        this.output = output;\n    }\n\n    @Override\n    public void handle(ActionEvent event) {\n        output.setText(&quot;Hello, &quot; + input.getText());\n    }\n}\n\nEventHandler&lt;ActionEvent&gt; handler = new GreetingHandler(name, output);\ngreet.setOnAction(handler);\nname.setOnAction(handler);<\/code><\/pre><p>构造器把要读取和更新的组件引用保存起来，因此 handle 被调用时可以访问它们。greet.setOnAction(handler) 让按钮使用它；name.setOnAction(handler) 让文本框按 Enter 触发同样逻辑。两个组件共用同一个响应对象，不等于每次自动创建一个新的响应。<\/p><p>另一种登记方式是 addEventHandler(ActionEvent.ACTION, handler)。初学时知道它也能挂接处理器即可。更精细地说，同一个 onAction 属性后设的处理器会替换先设的处理器；addEventHandler 可额外注册处理器。不要据课件的两个基本示例推断所有重复注册的行为完全相同。<\/p>"}, {"title": "6. 匿名类、lambda、方法引用：四种表面，一个回调目标", "html": "<p>当响应逻辑只用一次，单独命名一个类会比较长。匿名类是在 new 接口类型后立即写出实现。接口本身没有构造器可直接实例化；下面的大括号其实定义了一个没有名字的实现类，并创建其对象。外层分号结束整条赋值语句。<\/p><pre><code>EventHandler&lt;ActionEvent&gt; a = new EventHandler&lt;ActionEvent&gt;() {\n    @Override\n    public void handle(ActionEvent event) {\n        output.setText(&quot;Hello&quot;);\n    }\n};\n\nEventHandler&lt;ActionEvent&gt; b = event -&gt; output.setText(&quot;Hello&quot;);\ngreet.setOnAction(b);<\/code><\/pre><p>lambda 的 event 是参数，箭头右边是未来被调用时做的事。Java 从目标类型 EventHandler&lt;ActionEvent&gt; 知道参数类型及方法签名。可以写多行方法体，用大括号包住。lambda 适用于函数式接口，也就是只有一个抽象方法的接口；不是随便哪个多方法接口都能这样写。<\/p><pre><code>private void sayHello(ActionEvent event) {\n    output.setText(&quot;Hello&quot;);\n}\n\n// 在拥有 sayHello 方法的对象内部登记：\ngreet.setOnAction(this::sayHello);<\/code><\/pre><p>this::sayHello 是方法引用，把未来如何处理事件交出去；sayHello(event) 是现在执行方法。方法名不必叫 handle，但参数和返回类型要匹配目标接口的方法。控制器自己 implements EventHandler 并 setOnAction(this) 也可以，不过多个组件行为各不相同时，全部塞进一个 handle 会使职责难读。先选最能清楚表达行为的写法，再考虑短。<\/p>"}, {"title": "7. 定时器也是事件，不需要让界面等着数秒", "html": "<p>用户点击不是唯一事件来源。Timeline 可以安排计时事件；KeyFrame 描述到某个时间点要调用什么；Duration 指定时间。课件示例使用 1500 毫秒，也就是 1.5 秒。记住毫秒换秒要除以 1000，不要把 1500 当成 1500 秒。<\/p><pre><code>Timeline timer = new Timeline(\n    new KeyFrame(Duration.millis(1500), event -&gt; {\n        output.setText(&quot;Tick&quot;);\n    })\n);\ntimer.setCycleCount(Animation.INDEFINITE);\ntimer.play();\n// 停止时可以调用 timer.stop();<\/code><\/pre><p>new Timeline 只是创建安排；play 才开始运行；INDEFINITE 表示重复周期。这里只有一个 1.5 秒的 KeyFrame，所以运行后每个周期到该点就更新一次。它不是在创建时立即执行无限循环。长时间占用 JavaFX 应用线程的代码会让交互卡住，因此不要用忙等来做时钟。<\/p><p>连接理解：GUI 常会再按 Model、View、Controller 分工。Model 管状态与规则，View 显示状态，Controller 接收输入并协调；本节作为架构补充帮助你理解，不声称 W05/W06 已完整讲过 MVC。点“加一”应先改变模型里的 count，再让显示反映 count，而不是把所有状态藏在按钮文字里。演示中的浏览器按钮是在模拟事件思路，不是在浏览器直接运行 JavaFX。<\/p>"}], "quiz": [{"id": "gui-q1", "kind": "mcq", "prompt": "一个 Scene 只有一个根节点，这意味着什么？", "options": ["Scene 最多只能出现一个按钮", "根节点可以是容器，再包含很多后代节点", "所有组件都必须直接加入 Stage", "HBox 不能成为根节点"], "answer": 1, "explanation": "Scene 的根节点常是布局容器。容器本身是一个 Node，同时可以管理许多子节点；一个根并不限制整棵树只有一个节点。", "hint": "想想一棵树只有一个根，却可以有很多枝叶。", "tags": ["JavaFX", "Scene graph"]}, {"id": "gui-q2", "kind": "mcq", "prompt": "这段布局的主要视觉关系是什么？", "options": ["A 与 B 竖排，C 在它们下面", "A 与 B 横排，C 在这一行下面", "三个按钮全在同一行", "C 一定盖住 A"], "answer": 1, "explanation": "HBox 先把 A、B 横排；外层 VBox 把 row 与 C 竖排。每个容器只排列自己的直接子节点。", "hint": "先看最外面的 VBox，再向内看。", "tags": ["HBox", "VBox"], "code": "HBox row = new HBox(new Button(\"A\"), new Button(\"B\"));\nVBox root = new VBox(row, new Button(\"C\"));"}, {"id": "gui-q3", "kind": "mcq", "prompt": "执行 setOnAction 这一行时，最准确的描述是？", "options": ["马上把标签改成 Clicked", "登记响应；未来按钮触发动作时才改标签", "自动执行一次，以后不再执行", "每秒执行一次"], "answer": 1, "explanation": "lambda 方法体被登记为未来的事件响应。调用 setOnAction 本身不等于调用响应体。", "hint": "把“登记”和“执行”分成两步。", "tags": ["EventHandler", "lambda"], "code": "button.setOnAction(event -> label.setText(\"Clicked\"));"}, {"id": "gui-q4", "kind": "mcq", "prompt": "给按钮的 ActionEvent 处理器使用方法引用，应选哪句？", "options": ["button.setOnAction(this.greet());", "button.setOnAction(this::greet);", "button.handle(greet);", "button.setOnAction(new ActionEvent());"], "answer": 1, "explanation": "this::
