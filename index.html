        stage.querySelectorAll('[name="learning-answer"]').forEach(x=>x.onchange=()=>{item.transferDraft=x.value;save();});document.getElementById('transfer-input')?.addEventListener('input',e=>{item.transferDraft=e.target.value.slice(0,2400);save();});stage.querySelectorAll('[name="transfer-confidence"]').forEach(x=>x.onchange=()=>{item.transferConfidence=x.value;save();});document.getElementById('transfer-hint').onclick=()=>{item.transferHint=true;persist();document.getElementById('transfer-feedback').innerHTML=`<div class="hint">${esc(q.hint)}<p class="small">已记录使用帮助；不会因为之后答对就改成首次独立答对。</p></div>`;};document.getElementById('transfer-example').onclick=()=>{item.seenExample=true;item.phase='example';persist();renderItem();};document.getElementById('transfer-check').onclick=()=>{if(!String(item.transferDraft).trim()||!item.transferConfidence){document.getElementById('transfer-feedback').innerHTML='<p class="hint">先作答并记录把握，再核对结果。</p>';return;}finishItem(item,card,q);};
      }else if(item.phase==='result'){
        const m=l().memory[card.id],r=item.result,ok=item.transferCorrect;stage.innerHTML=`<p class="eyebrow">明确反馈 / 下次再检验</p><h2>${ok?(r.independent?'这一轮独立答对':'在帮助下完成了检验'):'找到一个需要纠正的地方'}</h2><p>你的答案：<code>${esc(q.kind==='mcq'?String.fromCharCode(65+Number(item.transferDraft))+'. '+q.options[Number(item.transferDraft)]:item.transferDraft)}</code></p><p>参考答案：<b>${esc(answer(q))}</b></p><div class="${ok?'feedback':'feedback wrong'}"><p>${esc(q.explanation)}</p></div>${r.highConfidenceError?'<div class="notice warm"><b>这次“有把握”却答错。</b> 优先改掉这条误解；下次不要仅记选项，先说出为什么另一种情况会不同。</div>':''}${item.correction?`<blockquote>你记下的纠正：${esc(item.correction)}</blockquote>`:''}${!ok?`<label for="result-correction" class="small">现在知道原因了，用一句话纠正刚才的想法（可选）</label><textarea id="result-correction" rows="2">${esc(item.correction)}</textarea>`:''}<div class="review-date"><span>下次建议复习</span><b>${fmt(m.dueAt)}</b><small>${r.outcome==='again'?'约 10 分钟后短时纠正，再跨天检验。':r.independent?'跨天成功才逐步拉开；同一天反复刷不会连续升级。':'本轮使用了示例或提示，安排次日上午再试。'}</small></div><div class="actions"><button class="primary" id="learning-next">${session.index+1<session.items.length?'下一个概念 →':'完成这一轮 →'}</button><a class="button" href="#chapter/${card.chapter}/read">回读对应讲解</a></div>`;document.getElementById('result-correction')?.addEventListener('input',e=>{item.correction=e.target.value.slice(0,1200);const latest=m.history[m.history.length-1];if(latest)latest.correction=item.correction;save();});document.getElementById('learning-next').onclick=()=>{session.index++;if(session.index>=session.items.length){session.finished=true;l().sessions.push({at:new Date().toISOString(),count:session.items.length,independent:session.items.filter(x=>x.result?.independent).length});l().sessions=l().sessions.slice(-60);}persist();renderToday();window.scrollTo({top:0,behavior:'instant'});};
      }
    }
    function finishItem(item,card,q){if(item.finished)return;item.transferAttempts++;item.transferCorrect=correct(q,item.transferDraft);const independent=item.transferCorrect&&item.recallGrade==='complete'&&!item.seenExample&&!item.transferHint&&!item.completionHint&&item.transferAttempts===1;const highConfidenceError=item.transferConfidence==='sure'&&!item.transferCorrect;const result={transferCorrect:item.transferCorrect,independent,highConfidenceError,confidence:item.transferConfidence,recallGrade:item.recallGrade,correction:item.correction};const m=LearningCore.schedule(l().memory[card.id],result);l().memory[card.id]=m;item.result={independent,highConfidenceError,outcome:m.lastOutcome,dueAt:m.dueAt};item.finished=true;item.phase='result';persist();renderItem();}
    function renderMethods(){const evidence=course.learningEvidence||[];main().innerHTML=title('EVIDENCE / LEARNING SCIENCE','这些学习方法，怎样帮到你','把证据变成学习动作，同时说清楚它能支持什么、还不能保证什么。')+`<section class="card"><h2>一轮学习的结构</h2><ol class="study-plan"><li><div><b>先闭卷回忆：</b>先重建规则，再看参考要点。不会时允许承认不会。</div></li><li><div><b>示例逐渐撤掉：</b>新手先读完整做法，再补关键一步，最后换题独立做。</div></li><li><div><b>带把握的明确反馈：</b>对错按题目判定；开放解释靠要点自查。优先找“很确定却错了”的误区。</div></li><li><div><b>隔开时间再问：</b>把建议复习排到以后；跨天独立成功后逐渐拉开间隔。</div></li><li><div><b>交错已学内容：</b>复习会跨主题切换；初次只推进一个新概念，避免一下混全书。</div></li></ol><a class="primary" href="#today">开始今日学习 →</a></section><div class="notice warm">方法有研究支持，不代表这套网站已经在 CSC207 做过随机实验，也不承诺固定提分或最快速度。1、3、7、14 天是本产品的透明默认日程，不是研究证明的个人最优值；时间预算只是大概安排。</div>${evidence.map(e=>`<section class="lesson-section"><h2>${esc(e.method)}</h2><p>${esc(e.finding)}</p><p><b>在这里怎么用：</b>${esc(e.implementation)}</p><details><summary>证据范围与适用限制</summary><p>${esc(e.limitation)}</p></details><p class="source-line"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.authors)}（${esc(e.year)}）：${esc(e.title)}</a></p></section>`).join('')}<section class="notice"><b>如何判断自己在变好：</b>隔天、换一道题、不给提示时，能解释规则并做对，比当天反复点出同一答案更有说服力。原来的 73 道章节题与自测仍保留；新增学习记录不会冒充原题正确数。</section>`;}
    return {homeCard,renderToday,renderMethods,normalize:raw=>LearningCore.normalize(raw,cards),reportLines:()=>['## 今日学习与间隔复习',...cards.filter(c=>l().memory[c.id]).map(c=>{const m=l().memory[c.id],note=[...m.history].reverse().find(x=>x.correction)?.correction;return '- '+c.title+'：'+({again:'需要纠正',guided:'在帮助下完成',independent:'本轮独立通过'}[m.lastOutcome])+'；下次 '+fmt(m.dueAt)+(note?'；我的纠正：'+note:'');})]};
  }
  return {create};
})();
</script>
<script>(() => {
  'use strict';
  const COURSE=JSON.parse(document.getElementById('course-data').textContent);
  const chapters=COURSE.chapters, questions=chapters.flatMap(c=>c.quiz.map(q=>({...q,chapter:c.id,chapterTitle:c.title})));
  const byId=Object.fromEntries(chapters.map(c=>[c.id,c])),qById=Object.fromEntries(questions.map(q=>[q.id,q]));
  const $=s=>document.querySelector(s),esc=LabRegistry.esc;
  const KEY='csc207-study-v1';let storageOK=true;let state={version:1,read:{},answers:{},chapter:'start',theme:'light',exam:null};
  try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===1)state={...state,...saved};}catch(e){storageOK=false;}
  state.read=state.read&&typeof state.read==='object'?state.read:{};state.answers=state.answers&&typeof state.answers==='object'?state.answers:{};
  let current={page:'home'},transientHints=new Set(),revealed=new Set(),drafts={},practiceIds=[],search='',toastTimer,focusChapterTab=false;
  const main=$('#main');
  const coach=LearningCoach.create({course:COURSE,getState:()=>state,save,onChange:renderNav});
  function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2700);}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}$('#save-status').textContent=storageOK?'进度保存在此浏览器':'此环境无法自动保存；请导出记录';updateProgress();updateChapterMeta();}
  function updateChapterMeta(){if(current.page==='chapter'&&byId[current.id]){const c=byId[current.id],m=main.querySelector('.meta');if(m)m.innerHTML=`<span>${c.sections.length} 个讲解小节</span><span>${c.quiz.length} 道练习</span><span>${chapterStats(c)}</span><span>${state.read[c.id]?'已标记读完':'尚未标记读完'}</span>`;}}
  function correctCount(){return questions.filter(q=>state.answers[q.id]?.correct&&!state.answers[q.id]?.assisted).length;}
  function wrong(){return questions.filter(q=>state.answers[q.id]&&(!state.answers[q.id].correct||state.answers[q.id].assisted));}
  function chapterStats(c){const n=c.quiz.filter(q=>state.answers[q.id]?.correct&&!state.answers[q.id]?.assisted).length;return `${n}/${c.quiz.length} 独立答对`;}
  function updateProgress(){$('#progress-label').textContent=`已读 ${chapters.filter(c=>state.read[c.id]).length}/${chapters.length} 章 · 独立答对 ${correctCount()}/${questions.length} 题`;}
  function routeHref(c,tab='read'){return `#chapter/${c}/${tab}`;}
  function renderNav(){const groups=[['开始','home','学习路线'],['学习工具','today','今日学习'],['学习工具','methods','为什么这样学'],['学习工具','labs','互动实验室'],['学习工具','practice','混合练习'],['学习工具','mistakes','错题与提示题'],['学习工具','exam','综合自测'],['参考','summary','考前速查'],['参考','glossary','中英术语表'],['参考','resources','资料与使用说明']];let html=`<a class="nav-item ${current.page==='home'?'active':''}" href="#home">学习路线</a>`;
    const names=['01 / JAVA 起步','02 / 对象与关系','03 / 设计与协作'];chapters.forEach((c,i)=>{if([0,5,9].includes(i))html+=`<p class="group">${names[[0,5,9].indexOf(i)]}</p>`;if(search&&!`${c.title} ${c.subtitle} ${c.sections.map(s=>s.title+' '+s.html.replace(/<[^>]+>/g,'')).join(' ')}`.toLowerCase().includes(search))return;html+=`<a class="nav-item ${current.page==='chapter'&&current.id===c.id?'active':''}" href="${routeHref(c.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(c.title.split('：')[0])}</span>${state.read[c.id]?'<span class="dot" aria-label="已标记读完">✓</span>':''}</a>`;});html+='<p class="group">练习与参考</p>';groups.slice(1).forEach(([,id,title])=>html+=`<a class="nav-item ${current.page===id?'active':''}" href="#${id}">${title}${id==='mistakes'&&wrong().length?`<span class="dot">${wrong().length}</span>`:''}</a>`);$('#nav').innerHTML=html;}
  function header(eyebrow,title,lead){return `<p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}`;}
  function renderHome(){const read=chapters.filter(c=>state.read[c.id]).length,n=correctCount(),last=byId[state.chapter]?state.chapter:'start';main.innerHTML=`<section class="hero"><p class="eyebrow">CSC207 / FALL 2026 / STUDY LAB</p><h1>把代码从看懂，<span class="line">变成自己会做。</span></h1><p class="lead">从第一行 Java 开始。先预测、再操作、看状态怎样改变，最后用一道新题确认自己真的理解。</p><div class="actions"><a class="primary" href="#today">${read?'安排今天的学习':'开始今日学习'} →</a><a class="button" href="${routeHref(read?last:'start')}">${read?'继续详细讲解':'先从第 1 章读起'}</a></div><div class="hero-note"><span>→</span><p>别急着看答案。每次先写下自己的预测，再用演示核对。做错后用一句话说明“我刚才把什么当成了什么”，再隔一会儿重做。</p></div></section>${coach.homeCard()}<div class="stats"><div><b>${chapters.length}</b><span>循序渐进的章节</span></div><div><b>${chapters.reduce((n,c)=>n+c.sections.length,0)}</b><span>细致讲解小节</span></div><div><b>${questions.length}</b><span>原有章节练习</span></div><div><b>${LabRegistry.ids.length}</b><span>可以操作的实验</span></div></div>${read||Object.keys(state.answers).length?`<div class="notice"><b>你的记录：</b>标记读完 ${read} 章，独立答对 ${n} 题。${wrong().length?`还有 ${wrong().length} 道错题或使用过提示的题值得回练。`:'“读完”和“独立答对”分开记录，阅读本身不代表掌握。'}<div class="revision-strip"><span style="width:${100*n/questions.length}%"></span></div></div>`:''}<div class="section-label"><h2>先选适合你的一条路线</h2></div><div class="grid"><section class="card"><p class="eyebrow">第一次学 / 推荐</p><h3>完整建立基础</h3><p>按顺序学习 13 章，每章先读讲解，再做演示，最后独立答题。建议分 5–7 次完成；读代码慢很正常，用时以理解为准。</p><ol class="study-plan"><li><div>第 1–3 章：读程序、算表达式、追踪控制流。</div></li><li><div>第 4–5 章：画引用与对象，分清值传递和状态。</div></li><li><div>第 6–9 章：关系、继承、多态、接口和测试。</div></li><li><div>第 10–13 章：GUI、SOLID、模式、团队开发。</div></li><li><div>隔天做混合练习，最后完成 20 题综合自测。</div></li></ol></section><section class="card"><p class="eyebrow">已经学过 / 时间紧</p><h3>先找薄弱处再回读</h3><p>先做混合练习，遇到不会的先点提示：看提示或解析的题也会进入回练。重点回到对应章节，而不是反复刷已记住的答案。</p><div class="actions"><a class="button" href="#practice">开始混合练习 →</a><a class="quiet" href="#summary">打开速查表</a></div><hr><p class="small">自测只是这套题上的表现，不是考试成绩预测。题目覆盖当前提供的 W01–W07；正式考试范围以老师公告为准。</p><p class="small">演示使用预设代码和可修改输入，帮助理解语义；不提供任意 Java 代码编译。完整例子可复制到 IDE 中验证。</p></section></div><div class="section-label"><h2>完整学习目录</h2><span class="small">中文讲清楚，保留英文术语</span></div><div class="path">${chapters.map((c,i)=>`<a class="path-item" href="${routeHref(c.id)}"><span class="path-index">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(c.title)}</h3><p>${esc(c.subtitle)}</p></div><span class="path-status">${state.read[c.id]?'已标记读完 · ':''}${chapterStats(c)}</span></a>`).join('')}</div><div class="notice warm">资料范围：你的 W01–W07 课件、批注版与两份 worksheet。课程大纲中的正则表达式、浮点表示、多线程等后续主题没有对应课件，因此本版没有假装覆盖整个学期。<a href="#resources">查看依据与补充说明</a></div>`;}
  function sourceLine(c){return `<div class="source-line">对应原资料：${c.source.map(s=>`${esc(s.file)} · 第 ${esc(s.pages)} 页`).join('；')}。例题经过重新编写与解释。</div>`;}
  function renderChapter(id,tab='read'){const c=byId[id];if(!c){location.hash='#home';return;}state.chapter=id;save();const i=chapters.indexOf(c);main.innerHTML=`<header class="chapter-top">${header(`CHAPTER ${String(i+1).padStart(2,'0')} / ${chapters.length}`,esc(c.title),esc(c.subtitle))}<div class="meta"><span>${c.sections.length} 个讲解小节</span><span>${c.quiz.length} 道练习</span><span>${chapterStats(c)}</span><span>${state.read[c.id]?'已标记读完':'尚未标记读完'}</span></div><div class="objectives"><p>学完后，你应该能够</p><ul>${c.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></header><div class="tabbar" role="tablist" aria-label="本章学习方式">${[['read','详细讲解'],['lab','动手演示'],['quiz','本章练习']].map(([t,n])=>`<button role="tab" id="tab-${t}" aria-controls="chapter-panel" aria-selected="${tab===t}" tabindex="${tab===t?0:-1}" data-tab="${t}">${n}</button>`).join('')}</div><div id="chapter-panel" role="tabpanel" aria-labelledby="tab-${tab}"></div>${sourceLine(c)}`;
    main.querySelectorAll('[data-tab]').forEach(x=>{x.onclick=()=>{focusChapterTab=true;location.hash=routeHref(id,x.dataset.tab);};x.onkeydown=e=>{const tabs=['read','lab','quiz'],i=tabs.indexOf(x.dataset.tab);let next;if(e.key==='ArrowRight')next=tabs[(i+1)%3];else if(e.key==='ArrowLeft')next=tabs[(i+2)%3];else if(e.key==='Home')next=tabs[0];else if(e.key==='End')next=tabs[2];if(next){e.preventDefault();focusChapterTab=true;location.hash=routeHref(id,next);}};});if(focusChapterTab){$('#tab-'+tab).focus({preventScroll:true});focusChapterTab=false;}const panel=$('#chapter-panel');
    if(tab==='lab'){LabRegistry.mount(id,panel);panel.insertAdjacentHTML('beforeend',`<div class="chapter-end"><h3>现在先离开演示，独立做一道题</h3><p>能重复看到正确结果，还不等于能自己预测。试着解释过程，再用练习验证。</p><a class="primary" href="${routeHref(id,'quiz')}">做本章练习 →</a></div>`);}
    else if(tab==='quiz'){panel.innerHTML=`<p class="small">先提交自己的答案，再看解释。看过提示或答案的题会标记为“需要独立重做”。文本题通常只填输出，不要加说明；多行输出可按原样换行。</p>${c.quiz.map((q,i)=>questionCard(q,i)).join('')}<div class="chapter-end"><h3>本章小结不是背一遍</h3><p>合上讲解，说出这章最容易混淆的两件事，再画一个例子或写一行代码区分它们。答对后隔天再试，避免只记住选项。</p>${i<chapters.length-1?`<a class="primary" href="${routeHref(chapters[i+1].id)}">进入下一章 →</a>`:'<a class="primary" href="#exam">进入综合自测 →</a>'}</div>`;bindQuestions(panel);}
    else{panel.innerHTML=`<nav class="lesson-toc" aria-label="本章小节">${c.sections.map((s,j)=>`<a href="#section-${id}-${j}" data-section="section-${id}-${j}">${j+1}. ${esc(s.title.replace(/^\d+[.\s·]+/,''))}</a>`).join('')}</nav>${c.sections.map((s,j)=>`<section class="lesson-section" id="section-${id}-${j}"><h2>${j+1}. ${esc(s.title.replace(/^\d+[.\s·]+/,''))}</h2><div>${s.html}</div></section>`).join('')}<section class="chapter-end"><h3>停一下，把这个概念用起来</h3><p>不用照着抄：先预测、再观察、最后解释为什么。遇到困惑时回到上面的具体例子。</p><div class="actions"><a class="primary" href="${routeHref(id,'lab')}">打开本章演示 →</a><a class="button" href="${routeHref(id,'quiz')}">直接做练习</a><button class="quiet" id="mark-read">${state.read[id]?'取消已读标记':'我已读完这一章'}</button></div></section>`;panel.querySelectorAll('[data-section]').forEach(x=>x.onclick=e=>{e.preventDefault();document.getElementById(x.dataset.section).scrollIntoView({behavior:'smooth'});});$('#mark-read').onclick=()=>{state.read[id]=!state.read[id];save();renderNav();$('#mark-read').textContent=state.read[id]?'取消已读标记':'我已读完这一章';toast(state.read[id]?'已记录读完；接下来用练习检验理解':'已取消读完标记');};}
  }
  function normalize(x){return String(x).trim().replace(/\r/g,'').replace(/[\t ]+/g,' ').replace(/\s*\n\s*/g,'\n');}
  function matches(q,v){return q.kind==='mcq'?Number(v)===q.answer:q.answer.some(a=>normalize(a)===normalize(v));}
  function answerText(q){return q.kind==='mcq'?`${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`:q.answer[0];}
  function questionCard(q,index,exam=false){const a=exam?null:state.answers[q.id],value=exam?state.exam?.answers[q.id]:drafts[q.id]??a?.value;return `<article class="quiz-card" data-question="${q.id}" ${exam?'data-exam="true"':''}><p class="qnum">${exam?'自测':'练习'} ${String(index+1).padStart(2,'0')} ${q.chapterTitle?` / ${esc(q.chapterTitle.split('：')[0])}`:''}</p><h3>${esc(q.prompt)}</h3>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}${q.kind==='mcq'?q.options.map((x,i)=>`<label class="option"><input type="radio" name="q-${q.id}" value="${i}" ${String(value)===String(i)?'checked':''}><span><b>${String.fromCharCode(65+i)}.</b> ${esc(x)}</span></label>`).join(''):`<label class="small" for="input-${q.id}">你的答案</label><textarea rows="2" id="input-${q.id}" placeholder="填写代码输出或题目要求的内容">${esc(value??'')}</textarea>`}${exam?'':`<div class="quiz-actions"><button class="primary" data-check>提交答案</button><button class="button" data-hint>给我一点提示</button><button class="quiet" data-reveal>查看答案</button><button class="quiet" data-retry>清空重做</button></div><div class="q-feedback" aria-live="polite">${a&&!a.pending?feedback(q,a):''}</div>`}</article>`;}
  function feedback(q,a){return `<div class="feedback ${a.correct?'':'wrong'}"><p class="result">${a.correct?(a.assisted?'答案正确 · 使用过提示，请隔一会独立重做':'回答正确 · 继续解释过程'):'还需要调整'}</p><p>${a.correct?'':'参考答案：<code>'+esc(answerText(q))+'</code>。 '}${esc(q.explanation)}</p><p class="small">${a.assisted?'此题已放入回练。':'再改一个条件想想：结果会怎样改变？'}</p></div>`;}
  function bindQuestions(root){root.querySelectorAll('[data-question]').forEach(card=>{const id=card.dataset.question,q=qById[id];const value=()=>q.kind==='mcq'?card.querySelector('input:checked')?.value:card.querySelector('textarea').value;const capture=()=>{drafts[id]=value();if(card.dataset.exam){state.exam.answers[id]=value();save();}};card.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',capture));if(card.dataset.exam)return;
      card.querySelector('[data-check]').onclick=()=>{const v=value();if(v===undefined||String(v).trim()===''){card.querySelector('.q-feedback').innerHTML='<div class="hint">先选一个选项或填写答案；不确定时可以先看提示。</div>';return;}const ok=matches(q,v),assisted=transientHints.has(id)||revealed.has(id)||!!state.answers[id]?.assisted||!ok,a={value:v,correct:ok,assisted,pending:false,attempts:(state.answers[id]?.attempts||0)+1,time:new Date().toISOString()};state.answers[id]=a;drafts[id]=v;save();renderNav();card.querySelector('.q-feedback').innerHTML=feedback(q,a);};
      card.querySelector('[data-hint]').onclick=()=>{transientHints.add(id);const prev=state.answers[id];state.answers[id]={value:value()??'',correct:prev?.correct??false,assisted:true,attempts:prev?.attempts||0,time:new Date().toISOString()};save();renderNav();card.querySelector('.q-feedback').innerHTML=`<div class="hint">提示：${esc(q.hint)}</div>`;};
      card.querySelector('[data-reveal]').onclick=()=>{revealed.add(id);state.answers[id]={value:value()??'',correct:false,assisted:true,attempts:state.answers[id]?.attempts||0,time:new Date().toISOString()};save();renderNav();card.querySelector('.q-feedback').innerHTML=`<div class="feedback"><p><b>参考答案：${esc(answerText(q))}</b></p><p>${esc(q.explanation)}</p><p class="small">已加入回练；不要马上把看过的答案当作独立掌握。</p></div>`;};
      card.querySelector('[data-retry]').onclick=()=>{transientHints.delete(id);revealed.delete(id);delete drafts[id];state.answers[id]={value:'',correct:false,assisted:false,pending:true,attempts:state.answers[id]?.attempts||0,time:new Date().toISOString()};save();renderNav();card.querySelectorAll('input').forEach(x=>x.checked=false);const ta=card.querySelector('textarea');if(ta)ta.value='';card.querySelector('.q-feedback').innerHTML='<p class="small">已隐藏反馈；提交新的独立答案后会更新记录。最好隔一段时间再试。</p>';};});}
  function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function balanced(count){const buckets=chapters.map(c=>shuffled(c.quiz.map(q=>q.id)));const ids=[];let j=0;while(ids.length<count&&buckets.some(x=>x.length)){const bucket=buckets[j%buckets.length];if(bucket.length)ids.push(bucket.pop());j++;}return shuffled(ids);}
  function renderPractice(isMistakes=false){const qs=isMistakes?wrong():(practiceIds.length?practiceIds:practiceIds=balanced(13)).map(id=>qById[id]);main.innerHTML=header(isMistakes?'REVIEW / RETRIEVAL':'PRACTICE / MIXED',isMistakes?'把薄弱处重新练一遍':'打乱章节，独立预测',isMistakes?'最近答错、看过答案或用过提示的题会留在这里。清空后独立答对，题目才会从这份回练清单移走。':'这一轮每章至少抽一道。随机的是题目组合，不是把相同题目的选项换个位置。')+`<div class="actions"><button class="button" id="new-practice">${isMistakes?'刷新回练清单':'换一轮题目'}</button><a class="quiet" href="#home">返回学习路线</a></div><p class="small">${qs.length} 题。做题时可以点“提示”，它会如实记录为需要独立重做。</p>${qs.map((q,i)=>questionCard(q,i)).join('')||'<div class="notice">当前没有需要回练的题。还没开始练习时清单也会为空；到混合练习做一轮，才能检查自己的理解。</div>'}`;$('#new-practice').onclick=()=>{if(!isMistakes)practiceIds=balanced(13);renderPractice(isMistakes);};bindQuestions(main);}
  function renderLabs(){main.innerHTML=header('EXPLORE / INTERACT','让一个概念动起来','选择一个实验。每次只改一个条件，先说出预测，再核对过程。')+`<div class="lab-controls"><label for="lab-picker">实验主题<select id="lab-picker">${chapters.map((c,i)=>`<option value="${c.id}">${String(i+1).padStart(2,'0')} · ${esc(c.title.split('：')[0])}</option>`).join('')}</select></label><a id="lab-chapter-link" class="button" href="${routeHref('start')}">回看对应讲解</a></div><div id="lab-stage"></div><p class="small">每个实验使用明确的预设代码；可更换输入和场景。它帮助你看清 Java 规则，不是任意代码编译器。</p>`;const mount=()=>{const id=$('#lab-picker').value;$('#lab-chapter-link').href=routeHref(id);LabRegistry.mount(id,$('#lab-stage'));};$('#lab-picker').onchange=mount;mount();}
  function renderExam(){let ex=state.exam;if(!ex){main.innerHTML=header('CHECK / 20 QUESTIONS','综合自测','不按章节提示，混合检查 Java 语义、面向对象、GUI、设计与协作。提交前不显示答案或提示。')+`<div class="card"><h2>用 20 道题检查当前掌握情况</h2><ul><li>从题库抽取 20 题，覆盖每一章；其中可能包含你练过的题。</li><li>建议自己计时 35–45 分钟。这不是老师的试卷，也不是成绩预测。</li><li>答题进度保存在当前浏览器。未答题提交后按未答计入。</li><li>提交后查看逐题解释，并把错误题加入回练。</li></ul><button class="primary" id="exam-start">开始这一轮自测 →</button></div>`;$('#exam-start').onclick=()=>{state.exam={ids:balanced(20),answers:{},started:new Date().toISOString(),submitted:false};save();renderExam();};return;}
    const qs=ex.ids.map(id=>qById[id]).filter(Boolean);if(ex.submitted){const correct=qs.filter(q=>ex.answers[q.id]!==undefined&&matches(q,ex.answers[q.id])).length;const byChapter=chapters.map(c=>{const sub=qs.filter(q=>q.chapter===c.id);return {c,total:sub.length,right:sub.filter(q=>ex.answers[q.id]!==undefined&&matches(q,ex.answers[q.id])).length};});main.innerHTML=header('RESULT / EXPLANATIONS','把分数变成下一步行动',`这一轮 ${correct} / ${qs.length} 题正确。下面每个解释都比总分更值得看。`)+`<div class="notice">建议优先回读：${byChapter.filter(x=>x.right<x.total).map(x=>`<a href="${routeHref(x.c.id)}">${esc(x.c.title.split('：')[0])}</a>`).join('、')||'这一轮没有答错的章节；隔天换一轮题，并尝试不看选项解释原因。'}</div><div class="actions"><button class="button" id="exam-new">重新抽一轮</button><a class="primary" href="#mistakes">打开错题回练 →</a></div><table><thead><tr><th>章节</th><th>这一轮正确数</th></tr></thead><tbody>${byChapter.map(x=>`<tr><td>${esc(x.c.title)}</td><td>${x.right} / ${x.total}</td></tr>`).join('')}</tbody></table>${qs.map((q,i)=>{const v=ex.answers[q.id],ok=v!==undefined&&matches(q,v);return `<article class="quiz-card"><p class="qnum">自测 ${i+1} / ${esc(q.chapterTitle.split('：')[0])}</p><h3>${esc(q.prompt)}</h3>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}<p class="small">你的答案：${v===undefined?'未答':esc(q.kind==='mcq'?String.fromCharCode(65+Number(v))+'. '+q.options[Number(v)]:v)}</p>${feedback(q,{correct:ok,assisted:false})}<a class="quiet" href="${routeHref(q.chapter)}">回读本章 →</a></article>`;}).join('')}`;$('#exam-new').onclick=()=>{state.exam=null;save();renderExam();};return;}
    main.innerHTML=header('CHECK / IN PROGRESS','综合自测进行中','先写完自己的答案，再统一提交。你可以暂时离开本页，回来继续这一轮。')+`<p class="small">开始时间：${esc(new Date(ex.started).toLocaleString('zh-CN'))} · ${qs.length} 题</p>${qs.map((q,i)=>questionCard(q,i,true)).join('')}<div class="actions"><button class="primary" id="exam-submit">提交并查看解析 →</button><button class="quiet" id="exam-abandon">放弃这一轮</button></div><div class="small" id="exam-message" aria-live="polite"></div>`;bindQuestions(main);$('#exam-submit').onclick=()=>{const unanswered=qs.filter(q=>ex.answers[q.id]===undefined||String(ex.answers[q.id]).trim()==='');if(unanswered.length&&!$('#exam-submit').dataset.warned){$('#exam-submit').dataset.warned='true';$('#exam-message').textContent=`还有 ${unanswered.length} 道未答。可以继续填写，也可再次点击提交（未答计为错误）。`;return;}ex.submitted=true;ex.finished=new Date().toISOString();qs.forEach(q=>{const v=ex.answers[q.id],ok=v!==undefined&&matches(q,v);state.answers[q.id]={value:v??'',correct:ok,assisted:false,attempts:(state.answers[q.id]?.attempts||0)+1,time:ex.finished};});save();renderNav();renderExam();window.scrollTo(0,0);};$('#exam-abandon').onclick=()=>{state.exam=null;save();renderExam();};}
  function renderSummary(){const rows=[['读代码的固定顺序','先检查能否编译 → 初始变量/对象 → 按行追踪 → 区分正常输出与异常。不要跳过编译期错误。'],['main 与 args','本课采用 public static void main(String[] args)。args 是 String 数组；数量看 length，索引从 0 开始。参数可以不用，名字可以换。'],['整数除法','int / int 先向 0 截断。double x = 5 / 2 得到 2.0；5.0 / 2 得到 2.5。'],['== 与 equals','基本类型 == 比较值；引用 == 比较是否同一对象。String 内容通常用 equals；null 上调用方法会出错。'],['值传递','总是复制值。引用变量复制的是引用值；修改共同对象能被看到，给形参重新赋值不修改调用方变量。'],['数组与 ArrayList','数组 length，不是 length()；ArrayList size()。数组大小固定；集合可增减。泛型参数使用引用类型，例如 Integer。'],['构造器','类同名，无返回类型；传统写法通过 super(...) 先构造父类部分。构造器不被继承；父类无无参构造器时要提供匹配调用。'],['this / super / static','this 是当前实例；super 访问父类部分。static 属于类，不能直接依赖某一个实例的 this。'],['重载与覆盖','重载：同名不同参数，编译期选择签名。覆盖：子类实现实例方法，运行期按对象类型分派。字段遮蔽与 static 隐藏看编译期类型。'],['声明类型与实际类型','声明类型决定可用成员；实际对象决定被覆盖实例方法的执行版本。向下转型需实际对象兼容，否则 ClassCastException。'],['abstract 与 interface','抽象类可共享实例状态和部分实现；接口表达能力契约，可实现多个。接口的普通抽象方法由 public 实现；现代接口还可有 default/static/private 方法。'],['final','变量只能赋值一次，不代表引用对象内容不能改变；final 方法不能被覆盖；final 类不能被继承。'],['对象关系','is-a 想继承；has-a 想关联/聚合/组合。组合强调概念上的强所有权与生命周期约束，Java 字段本身不会自动强制这些约束。'],['测试与异常','预期来自规格。测普通值、边界与非法输入；全绿不等于证明正确。assertEquals(expected, actual)，异常用 assertThrows。'],['GUI 事件','Stage 窗口、Scene 场景、Node 节点；VBox 竖排、HBox 横排。注册回调先发生，处理器要等对应事件发生才执行。'],['SOLID','SRP 按变化原因分工；OCP 围绕变化点扩展；LSP 子类兑现父契约；ISP 按客户端需要分接口；DIP 依赖抽象。'],['Singleton','private 构造器 + 类保存唯一实例 + static 访问点。只有 static 方法不足以保证单例；朴素 lazy 实现要注意并发。'],['Observer','Subject 维护订阅者，变化时通知。Push 携带数据；Pull 通知后再取数据。退订后不应再收后续通知。'],['Scrum','短迭代交付可检查的增量；Product Owner 管价值与排序，Scrum Master 帮助过程，Developers 完成工作；Review 看产品，Retrospective 改过程。'],['Git','工作区 → add → Index → commit → 本地历史 → push → 远程。merge 在当前分支上吸收另一分支；清冲突后验证、add、完成提交。']];main.innerHTML=header('REFERENCE / QUICK RECALL','考前速查：先能解释，再背术语','第一次学习请从完整讲解开始。这张表用于检索和自我提问，不能替代动手追踪。')+`<div class="actions"><button class="button" id="print-summary">打印这张速查表</button><a class="primary" href="#practice">用混合练习验证 →</a></div><table><thead><tr><th style="width:24%">概念</th><th>需要说清楚的规则</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table><section class="card"><h2>解释设计题时，用这四句话</h2><ol><li>目前哪个类负责什么，依赖谁？</li><li>当哪种需求变化发生，哪里会被迫修改？</li><li>引入什么接口、责任划分或对象关系，怎样减小影响？</li><li>这种设计增加了什么复杂度，为什么在此场景值得？</li></ol></section>`;$('#print-summary').onclick=()=>window.print();}
  function renderGlossary(){const terms=COURSE.glossary;main.innerHTML=header('WORDS / CONCEPTS','中英术语，不只记翻译','用一句直白解释，把课件里的英文词接回你已经做过的例子。')+`<label for="term-search" class="small">查术语</label><input id="term-search" type="search" style="width:100%;margin:10px 0 25px" placeholder="例如 reference、依赖、回调"><div class="terms" id="terms"></div>`;const run=()=>{const s=$('#term-search').value.toLowerCase();$('#terms').innerHTML=terms.filter(t=>t.join(' ').toLowerCase().includes(s)).map(t=>`<div><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div>`).join('')||'<p class="empty">没有匹配项，试试较短的关键词。</p>';};$('#term-search').oninput=run;run();}
  function renderResources(){main.innerHTML=header('SOURCES / HOW TO STUDY','资料依据与使用说明','这份手册围绕你的现有课件重新组织，先补基础，再把概念接起来。')+`<div class="notice">新增的今日学习把闭卷回忆、间隔复习、示例渐隐和信心反馈接入实际练习。<a href="#today">开始学习</a> · <a href="#methods">查看研究依据与适用限制</a></div><section class="lesson-section"><h2>覆盖范围</h2><p>本版覆盖你提供的 W01–W07（Fall 2026），包括带笔记或批注的版本、W04/W05 worksheet 和 W06 GUI/Timer 补充。共 ${chapters.length} 章、${chapters.reduce((n,c)=>n+c.sections.length,0)} 个讲解小节、${questions.length} 道题、${LabRegistry.ids.length} 个互动实验。原课件有重复处，手册按学习依赖关系重新排序。</p><p>课程大纲还列出正则表达式、浮点数表示、多线程、持久化等后续内容；没有对应周课件的部分不在本版系统讲解范围。正式考试考哪些章节，需要以老师公告为准。</p><p>课件中的少量表述为教学简化，本手册作了区分：局部变量未初始化不同于 null；包内默认权限不同于 private；final 引用不同于不可变对象；现代接口不只有抽象方法；Observer 的 pull 不必等于轮询。</p></section><section class="lesson-section"><h2>怎么学才高效</h2><ol><li><b>第一次：</b>按顺序读，遇到代码先停 15 秒预测。把变量表和对象箭头画在纸上。</li><li><b>动手：</b>每次只改一个输入；先说预期，再点下一步。若不一致，找到第一步分歧。</li><li><b>练习：</b>先自己提交。看提示或答案没有关系，但会记入回练；这能避免把熟悉感当成理解。</li><li><b>隔天：</b>先不看讲解，做混合练习和错题。不要仅记题目答案，要解释代码改变后为什么结果会变。</li><li><b>最后：</b>完成综合自测；先处理每一题的具体误解，再看总分。</li></ol></section><section class="lesson-section"><h2>输入、保存和离线使用</h2><p>打开主文件即可学习，无需安装额外库或登录。演示只对预设代码和选定输入进行语义模拟，不会把任意 Java 代码当作可运行程序。完整示例可以在自己的 IDE 中验证。JavaFX 示例需要课程项目的 JavaFX 依赖，不能直接假定 JDK 已经内置 JavaFX。</p><p>答题结果、已读标记和自测进度保存在当前浏览器本地。切换浏览器、使用隐私窗口或清除浏览器数据可能使进度不可见；左下角可导出 JSON 学习记录，之后再导入。本地打开文件和浏览器预览地址可能使用不同的存储空间。</p><div class="actions"><button class="button" id="resource-export">导出学习记录</button><button class="button" id="report-export">导出中文复习报告</button><button class="quiet" id="reset-data">清空本浏览器学习记录</button></div><p id="reset-message" class="small" aria-live="polite"></p></section><section class="lesson-section"><h2>每章对应资料</h2>${chapters.map(c=>`<div><h3>${esc(c.title)}</h3>${sourceLine(c)}</div>`).join('')}</section><section class="lesson-section"><h2>用于核对语义的官方资料</h2><p>以下参考用于核对具体规则，不代替你的课件。Oracle 传统教程基于 JDK 8，本手册采用课程中的传统语法；JUnit 参考固定为 5.10.2，与“当前最新版本”无关。</p><ul>${COURSE.references.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul></section>`;$('#resource-export').onclick=exportState;$('#report-export').onclick=exportReport;$('#reset-data').onclick=()=>{if(!$('#reset-data').dataset.confirm){$('#reset-data').dataset.confirm='yes';$('#reset-message').textContent='再次点击将清空这个浏览器中的全部已读、答题和自测记录。建议先导出；其他浏览器或导出文件不受影响。';return;}state={version:1,read:{},answers:{},chapter:'start',theme:state.theme,exam:null,learning:coach.normalize(null)};transientHints.clear();revealed.clear();drafts={};save();renderNav();toast('本浏览器学习记录已清空');renderResources();};}
  function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  function exportState(){download('CSC207-学习记录.json',JSON.stringify({...state,exported:new Date().toISOString()},null,2),'application/json');toast('已导出学习记录');}
  function exportReport(){const s=['# CSC207 复习记录',`导出时间：${new Date().toLocaleString('zh-CN')}`,`已读 ${chapters.filter(c=>state.read[c.id]).length}/${chapters.length} 章；独立答对 ${correctCount()}/${questions.length} 题。`,'','## 章节',...chapters.map(c=>`- ${state.read[c.id]?'[x]':'[ ]'} ${c.title}：${chapterStats(c)}`),'','## 需要回练',...wrong().map(q=>`- ${q.chapterTitle} / ${q.id}：${q.prompt}\n  纠正：${q.explanation}`),'',...coach.reportLines(),'','提示：这是本题库中的表现，不是考试成绩预测。'];download('CSC207-复习报告.md',s.join('\n\n'),'text/markdown;charset=utf-8');toast('已导出中文复习报告');}
  function route(){const hash=location.hash.slice(1)||'home';if(hash.startsWith('section-'))return;const parts=hash.split('/');current={page:parts[0],id:parts[1],tab:parts[2]||'read'};if(current.page==='chapter'&&!['read','lab','quiz'].includes(current.tab))current.tab='read';$('#breadcrumb').textContent=current.page==='chapter'?(byId[current.id]?.title||'课程'):{home:'学习路线',today:'今日学习',methods:'为什么这样学',labs:'互动实验室',practice:'混合练习',mistakes:'错题与提示题',exam:'综合自测',summary:'考前速查',glossary:'中英术语表',resources:'资料与使用说明'}[current.page]||'学习路线';$('#sidebar').classList.remove('open');renderNav();switch(current.page){case'today':coach.renderToday();break;case'methods':coach.renderMethods();break;case'chapter':renderChapter(current.id,current.tab);break;case'labs':renderLabs();break;case'practice':renderPractice();break;case'mistakes':renderPractice(true);break;case'exam':renderExam();break;case'summary':renderSummary();break;case'glossary':renderGlossary();break;case'resources':renderResources();break;default:current.page='home';renderHome();}window.scrollTo({top:0,behavior:'instant'});}
  $('#search').oninput=()=>{search=$('#search').value.toLowerCase().trim();renderNav();};$('#mobile-menu').onclick=()=>$('#sidebar').classList.add('open');$('#mobile-close').onclick=()=>$('#sidebar').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('open');});function theme(){document.documentElement.dataset.theme=state.theme;$('#theme').textContent=state.theme==='dark'?'日间阅读':'夜间阅读';}$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';theme();save();};$('#export-progress').onclick=exportState;$('#import-progress').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const d=JSON.parse(await f.text());if(d.version!==1||!d.read||!d.answers)throw Error('不是兼容的复习记录');const clean={};Object.entries(d.answers).forEach(([id,a])=>{if(qById[id]&&a&&typeof a==='object'&&['string','number'].includes(typeof a.value))clean[id]={value:a.pending?'':a.value,correct:!a.pending&&!!a.correct&&matches(qById[id],a.value),assisted:!!a.assisted,pending:!!a.pending,attempts:Math.max(0,Number(a.attempts)||0),time:String(a.time||'')};});let exam=null;if(d.exam&&Array.isArray(d.exam.ids)){const ids=[...new Set(d.exam.ids)].filter(id=>qById[id]).slice(0,73);const answers={};for(const id of ids){const v=d.exam.answers?.[id],q=qById[id];if(q.kind==='mcq'&&v!==undefined&&Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<q.options.length)answers[id]=String(v);else if(q.kind==='text'&&typeof v==='string')answers[id]=v.slice(0,2000);}if(ids.length)exam={ids,answers,started:Number.isNaN(Date.parse(d.exam.started))?new Date().toISOString():d.exam.started,submitted:!!d.exam.submitted,finished:d.exam.finished};}state={...state,read:Object.fromEntries(chapters.filter(c=>d.read[c.id]).map(c=>[c.id,true])),answers:clean,chapter:byId[d.chapter]?d.chapter:'start',exam,learning:coach.normalize(d.learning===undefined?state.learning:d.learning)};drafts={};transientHints.clear();revealed.clear();save();route();toast(exam?'已导入记录，并恢复这一轮自测':'已导入学习记录');}catch(err){toast('无法导入：'+err.message);}e.target.value='';};window.addEventListener('hashchange',route);theme();updateProgress();route();if(!storageOK)$('#save-status').textContent='此环境无法自动保存；请导出记录';
})();
